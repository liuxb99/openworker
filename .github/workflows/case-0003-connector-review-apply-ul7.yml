name: Case 0003 Connector Review Apply UL7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case-0003-connector-review-apply-ul7.yml'

permissions:
  contents: read

env:
  CASE0003_ASSIGNED_HOST: DESKTOP-UL7V2VV
  CASE0003_WORKSPACE: 'D:\AI-Work\jobs\0003-YUJING-BRIDGE'
  CASE0003_REVISION_ID: rev_0851c5ab49ff459d83ee1cb6268ea8d3
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  apply:
    name: Apply exact Google Drive connector review to WorkLedger
    runs-on: [self-hosted, Windows, X64, UL7]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: openworker
      - name: Verify fixed host and exact immutable bundle
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine $env:CASE0003_ASSIGNED_HOST){throw 'Case 0003 assigned host mismatch'}
          $bundle=Join-Path $env:CASE0003_WORKSPACE ('.openworker\reviews\'+$env:CASE0003_REVISION_ID)
          $sha=(Get-Content -LiteralPath (Join-Path $bundle 'manifest.sha256') -Raw).Trim().ToLowerInvariant()
          if($sha -ne '349e1c0e2eaad9994cb6989c956cc93c8c38f8bd4a5ff0590eb9870ad788a020'){throw ('Case 0003 immutable bundle SHA mismatch '+$sha)}
          Write-Host "CASE0003_CONNECTOR_BUNDLE_OK revision=$env:CASE0003_REVISION_ID manifest_sha256=$sha"
      - name: Recover blocked publication step through connector cloud proof
        run: |
          $ErrorActionPreference='Stop'; $script='openworker\scripts\case_worklist_action.py'; $wlPath=Join-Path $env:CASE0003_WORKSPACE '.openworker\case-worklist.json'; $wl=Get-Content -LiteralPath $wlPath -Raw|ConvertFrom-Json; $parent=@($wl.steps|Where-Object{$_.step_id -eq '0003-160'})[0]
          if([string]$parent.status -eq 'BLOCKED'){
            $rid='R-0003-160-CONNECTOR-CLOUD'; $existing=@($wl.steps|Where-Object{$_.step_id -eq $rid})
            if($existing.Count -eq 0){python $script add-repair --workspace-root $env:CASE0003_WORKSPACE --parent-step-id '0003-160' --step-id $rid --title 'Verify Google Drive connector cloud publication' --allowed-action 'openworker.review.repair' --acceptance drive_revision_folder_id --acceptance drive_file_id --acceptance cloud_zip_sha256 --acceptance bundle_manifest_sha256; if($LASTEXITCODE -ne 0){throw 'connector cloud repair insertion failed'}}
            $exec="github:$env:GITHUB_RUN_ID:$env:GITHUB_RUN_ATTEMPT:connector-cloud"; python $script start --workspace-root $env:CASE0003_WORKSPACE --step-id $rid --action-id 'openworker.review.repair' --execution-id $exec; if($LASTEXITCODE -ne 0){throw 'connector cloud repair lease failed'}
            python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id $rid --key drive_revision_folder_id --value '1dbQDGsbW1_X3SmX7doPbQ27ElIyCtDJh'; python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id $rid --key drive_file_id --value '15vrTKyhoObSZXxCFCbRfVDbtGTNnGnPA'; python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id $rid --key cloud_zip_sha256 --value 'e8a498a6f2b9c80029669cf3b0a9afb9943979eb1317d96e03e1999accd4e6ab'; python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id $rid --key bundle_manifest_sha256 --value '349e1c0e2eaad9994cb6989c956cc93c8c38f8bd4a5ff0590eb9870ad788a020'; python $script complete-action --workspace-root $env:CASE0003_WORKSPACE --step-id $rid --action-id 'openworker.review.repair' --execution-id $exec; python $script pass --workspace-root $env:CASE0003_WORKSPACE --step-id $rid; if($LASTEXITCODE -ne 0){throw 'connector cloud repair pass failed'}
          }
          $wl=Get-Content -LiteralPath $wlPath -Raw|ConvertFrom-Json; $parent=@($wl.steps|Where-Object{$_.step_id -eq '0003-160'})[0]; if([string]$parent.status -ne 'READY'){throw ('publication parent not READY: '+[string]$parent.status)}
          $exec="github:$env:GITHUB_RUN_ID:$env:GITHUB_RUN_ATTEMPT:connector-publish"; python $script start --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-160' --action-id 'openworker.review.publish' --execution-id $exec; python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-160' --key review_bundle --value (Join-Path $env:CASE0003_WORKSPACE ('.openworker\reviews\'+$env:CASE0003_REVISION_ID)); python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-160' --key drive_receipt --value 'google-drive-connector:file=15vrTKyhoObSZXxCFCbRfVDbtGTNnGnPA;folder=1dbQDGsbW1_X3SmX7doPbQ27ElIyCtDJh;zip_sha256=e8a498a6f2b9c80029669cf3b0a9afb9943979eb1317d96e03e1999accd4e6ab;manifest_sha256=349e1c0e2eaad9994cb6989c956cc93c8c38f8bd4a5ff0590eb9870ad788a020'; python $script complete-action --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-160' --action-id 'openworker.review.publish' --execution-id $exec; python $script pass --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-160'; if($LASTEXITCODE -ne 0){throw 'connector publication worklist pass failed'}
      - name: Materialize exact ChatGPT review receipt
        run: |
          $bundle=Join-Path $env:CASE0003_WORKSPACE ('.openworker\reviews\'+$env:CASE0003_REVISION_ID); $receipt=Join-Path $bundle 'connector-llm-review-receipt.json'; $payload=[ordered]@{schema_version='openworker-connector-llm-review-receipt/v1';transport='google-drive-connector';revision_id=$env:CASE0003_REVISION_ID;verdict='TOOL_GAP';bundle_manifest_sha256='349e1c0e2eaad9994cb6989c956cc93c8c38f8bd4a5ff0590eb9870ad788a020';summary='Blender terrain render is now non-blank and visibly contains terrain geometry, but the current review package still does not present a recognizable bridge/model and the SceneX browse screenshot is visually near-uniform/blank. Mechanical SceneX counters pass, yet semantic/visual review cannot accept the delivery.';owning_repo='liuxb99/SceneX';gap_capability='scenex.semantic_visible_terrain_review';gap_description='SceneX REAL browse reports active terrain geometry but the exact cloud-reviewed 1280x720 screenshot is visually near-uniform and does not expose useful terrain/bridge geometry. Blender also lacks a recognizable bridge, so delivery usefulness is not established.';verification_plan=@('Add independent semantic non-blank/readability gate for SceneX screenshots.','Repair SceneX camera/material/lighting/framing so terrain is visually readable.','Verify whether bridge/model is required and make it visibly present before next review revision.','Rerun only affected presentation stages; preserve DTM/AOI provenance.');reviewed_artifacts=@('blender-render','scenex-browse','scenex-evidence','delivery-index','mechanical-acceptance');cloud_publication=[ordered]@{drive_revision_folder_id='1dbQDGsbW1_X3SmX7doPbQ27ElIyCtDJh';drive_file_id='15vrTKyhoObSZXxCFCbRfVDbtGTNnGnPA';cloud_zip_sha256='e8a498a6f2b9c80029669cf3b0a9afb9943979eb1317d96e03e1999accd4e6ab';bundle_manifest_sha256='349e1c0e2eaad9994cb6989c956cc93c8c38f8bd4a5ff0590eb9870ad788a020'}}; $payload|ConvertTo-Json -Depth 8|Set-Content -LiteralPath $receipt -Encoding utf8; Write-Host "CASE0003_CONNECTOR_REVIEW_RECEIPT_READY receipt=$receipt verdict=TOOL_GAP"
      - name: Govern step 170 and apply review to WorkLedger
        run: |
          $ErrorActionPreference='Stop'; $script='openworker\scripts\case_worklist_action.py'; $exec="github:$env:GITHUB_RUN_ID:$env:GITHUB_RUN_ATTEMPT:inspect-drive"; python $script start --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-170' --action-id 'openworker.review.inspect_drive' --execution-id $exec; $bundle=Join-Path $env:CASE0003_WORKSPACE ('.openworker\reviews\'+$env:CASE0003_REVISION_ID); $receipt=Join-Path $bundle 'connector-llm-review-receipt.json'; python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-170' --key drive_revision_folder_id --value '1dbQDGsbW1_X3SmX7doPbQ27ElIyCtDJh'; python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-170' --key review_receipt --value $receipt; python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-170' --key review_decision --value 'TOOL_GAP'; python $script complete-action --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-170' --action-id 'openworker.review.inspect_drive' --execution-id $exec; python $script pass --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-170'; if($LASTEXITCODE -ne 0){throw 'step 170 governance failed'}; python openworker\scripts\case0003_apply_connector_review.py --workspace $env:CASE0003_WORKSPACE --revision-id $env:CASE0003_REVISION_ID --receipt $receipt; if($LASTEXITCODE -ne 4){throw ('expected governed TOOL_GAP exit=4 got '+$LASTEXITCODE)}; Write-Host 'CASE0003_CONNECTOR_REVIEW_APPLIED verdict=TOOL_GAP'
      - name: Govern step 180 review application evidence
        run: |
          $ErrorActionPreference='Stop'; $script='openworker\scripts\case_worklist_action.py'; $exec="github:$env:GITHUB_RUN_ID:$env:GITHUB_RUN_ATTEMPT:apply-review"; $bundle=Join-Path $env:CASE0003_WORKSPACE ('.openworker\reviews\'+$env:CASE0003_REVISION_ID); $receipt=Join-Path $bundle 'connector-llm-review-receipt.json'; python $script start --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-180' --action-id 'openworker.review.apply' --execution-id $exec; python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-180' --key review_receipt --value $receipt; python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-180' --key ledger_status --value 'TOOL_GAP_REWORK_REQUIRED'; python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-180' --key review_decision --value 'TOOL_GAP'; python $script complete-action --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-180' --action-id 'openworker.review.apply' --execution-id $exec; python $script pass --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-180'; if($LASTEXITCODE -ne 0){throw 'step 180 governance failed'}; Write-Host 'CASE0003_REWORK_REQUIRED delivery_step_must_not_run=true'
      - name: Upload bounded review governance evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: case-0003-connector-review-${{ github.run_id }}
          path: |
            D:\AI-Work\jobs\0003-YUJING-BRIDGE\.openworker\case-worklist.json
            D:\AI-Work\jobs\0003-YUJING-BRIDGE\.openworker\reviews\rev_0851c5ab49ff459d83ee1cb6268ea8d3\connector-llm-review-receipt.json
            D:\AI-Work\jobs\0003-YUJING-BRIDGE\acceptance\openworker-final\connector-review-apply-rev_0851c5ab49ff459d83ee1cb6268ea8d3.json
          if-no-files-found: warn
          retention-days: 14
