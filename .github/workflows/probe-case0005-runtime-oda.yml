name: Probe Case0005 Runtime ODA

on:
  push:
    branches: [main]
    paths:
      - 'diagnostic-requests/case0005-runtime.json'

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, ODA]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe fixed Case0005 cwd and process startup
        shell: cmd
        run: >-
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\probe-case0005-runtime-oda.ps1"
