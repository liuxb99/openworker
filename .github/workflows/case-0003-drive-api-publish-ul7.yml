name: Case 0003 Google Drive API Review Publish UL7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case-0003-drive-api-publish-ul7.yml'
      - 'case-worklists/0003.json'

permissions:
  contents: read

concurrency:
  group: case-0003-drive-api-publish-ul7
  cancel-in-progress: false

env:
  CASE0003_ASSIGNED_HOST: DESKTOP-UL7V2VV
  CASE0003_WORKSPACE: 'D:\AI-Work\jobs\0003-YUJING-BRIDGE'
  OPENWORKER_REVIEW_DRIVE_FOLDER_ID: ${{ vars.OPENWORKER_REVIEW_DRIVE_FOLDER_ID }}
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  publish:
    name: Publish canonical Case 0003 review bundle to Google Drive API
    runs-on: [self-hosted, Windows, X64, UL7]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Checkout OpenWorker main
        uses: actions/checkout@v4
        with:
          ref: main
          path: openworker

      - name: Verify fixed UL7 host and workspace
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine $env:CASE0003_ASSIGNED_HOST){ throw "CASE0003_DRIVE_ASSIGNED_HOST_MISMATCH host=$env:COMPUTERNAME assigned=$env:CASE0003_ASSIGNED_HOST" }
          if(-not (Test-Path -LiteralPath $env:CASE0003_WORKSPACE -PathType Container)){ throw "CASE0003_WORKSPACE_UNAVAILABLE $env:CASE0003_WORKSPACE" }

      - name: Ensure, repair if needed, and lease canonical Drive publication action
        id: worklist
        env:
          PYTHONPATH: ${{ github.workspace }}\openworker
        run: |
          $ErrorActionPreference='Stop'
          $script='openworker\scripts\case_worklist_action.py'
          $manifest=Join-Path $env:GITHUB_WORKSPACE 'openworker\case-worklists\0003.json'
          python $script ensure --workspace-root $env:CASE0003_WORKSPACE --manifest $manifest
          if($LASTEXITCODE -ne 0){throw 'Case 0003 worklist ensure failed'}

          # A previous publication failure leaves 0003-160 BLOCKED by design.
          # It may only return to READY through a governed repair whose evidence
          # proves that a new immutable rework revision/bundle now exists.
          $worklistPath=Join-Path $env:CASE0003_WORKSPACE '.openworker\case-worklist.json'
          $statePath=Join-Path $env:CASE0003_WORKSPACE 'acceptance\openworker-final\work-ledger-final-acceptance.json'
          if(-not (Test-Path -LiteralPath $statePath -PathType Leaf)){throw 'Case 0003 final acceptance state unavailable for repair gate'}
          $ev=Get-Content -LiteralPath $statePath -Raw|ConvertFrom-Json
          $revision=[string]$ev.revision_id
          if([string]::IsNullOrWhiteSpace($revision)){throw 'Case 0003 revision_id missing for repair gate'}
          if([string]$ev.status -ne 'WAITING_DRIVE_HANDOFF' -and [string]$ev.status -ne 'WAITING_LLM_REVIEW'){throw ('Case 0003 revision is not review-publishable: '+[string]$ev.status)}
          $bundle=Join-Path $env:CASE0003_WORKSPACE ('.openworker\reviews\'+$revision)
          $manifestShaPath=Join-Path $bundle 'manifest.sha256'
          if(-not (Test-Path -LiteralPath $bundle -PathType Container)){throw ('Case 0003 review bundle unavailable: '+$bundle)}
          if(-not (Test-Path -LiteralPath $manifestShaPath -PathType Leaf)){throw 'Case 0003 manifest.sha256 missing'}
          $manifestSha=(Get-Content -LiteralPath $manifestShaPath -Raw).Trim()
          if($manifestSha -notmatch '^[0-9a-fA-F]{64}$'){throw 'Case 0003 manifest SHA is invalid'}

          $wl=Get-Content -LiteralPath $worklistPath -Raw|ConvertFrom-Json
          $parent=@($wl.steps|Where-Object{$_.step_id -eq '0003-160'})[0]
          if($null -eq $parent){throw 'Case 0003 worklist parent step 0003-160 missing'}
          if([string]$parent.status -eq 'BLOCKED'){
            $short=($revision -replace '^rev_','')
            if($short.Length -gt 12){$short=$short.Substring(0,12)}
            $repairId='R-0003-160-'+$short
            $existing=@($wl.steps|Where-Object{$_.step_id -eq $repairId})
            if($existing.Count -eq 0){
              python $script add-repair --workspace-root $env:CASE0003_WORKSPACE --parent-step-id '0003-160' --step-id $repairId --title 'Bind fresh rework revision for Drive publication' --allowed-action 'openworker.review.repair' --acceptance 'rework_revision' --acceptance 'review_bundle' --acceptance 'bundle_manifest_sha256'
              if($LASTEXITCODE -ne 0){throw 'Case 0003 governed Drive repair insertion failed'}
            }
            $wl=Get-Content -LiteralPath $worklistPath -Raw|ConvertFrom-Json
            $repair=@($wl.steps|Where-Object{$_.step_id -eq $repairId})[0]
            if($null -eq $repair){throw 'Case 0003 governed Drive repair step missing after insertion'}
            if([string]$repair.status -eq 'READY'){
              $repairExecution="github:${{ github.run_id }}:${{ github.run_attempt }}:review-repair"
              python $script start --workspace-root $env:CASE0003_WORKSPACE --step-id $repairId --action-id 'openworker.review.repair' --execution-id $repairExecution
              if($LASTEXITCODE -ne 0){throw 'Case 0003 governed Drive repair lease failed'}
              python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id $repairId --key rework_revision --value $revision
              python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id $repairId --key review_bundle --value $bundle
              python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id $repairId --key bundle_manifest_sha256 --value $manifestSha
              python $script complete-action --workspace-root $env:CASE0003_WORKSPACE --step-id $repairId --action-id 'openworker.review.repair' --execution-id $repairExecution
              if($LASTEXITCODE -ne 0){throw 'Case 0003 governed Drive repair release failed'}
              python $script pass --workspace-root $env:CASE0003_WORKSPACE --step-id $repairId
              if($LASTEXITCODE -ne 0){throw 'Case 0003 governed Drive repair pass failed'}
              Write-Host "CASE0003_DRIVE_REPAIR_PASS repair=$repairId revision=$revision manifest_sha256=$manifestSha"
            } elseif([string]$repair.status -ne 'PASSED'){
              throw ('Case 0003 governed Drive repair is not executable: '+[string]$repair.status)
            }
          }

          $wl=Get-Content -LiteralPath $worklistPath -Raw|ConvertFrom-Json
          $parent=@($wl.steps|Where-Object{$_.step_id -eq '0003-160'})[0]
          if([string]$parent.status -ne 'READY' -and [string]$parent.status -ne 'RUNNING'){throw ('Case 0003 Drive parent not ready after repair gate: '+[string]$parent.status)}
          $execution="github:${{ github.run_id }}:${{ github.run_attempt }}:review-publish"
          python $script start --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-160' --action-id 'openworker.review.publish' --execution-id $execution
          if($LASTEXITCODE -ne 0){throw 'Case 0003 canonical Drive action lease failed'}
          "execution_id=$execution" >> $env:GITHUB_OUTPUT

      - name: Verify existing immutable review bundle input
        run: |
          $ErrorActionPreference='Stop'
          $state=Join-Path $env:CASE0003_WORKSPACE 'acceptance\openworker-final\work-ledger-final-acceptance.json'
          if(-not (Test-Path -LiteralPath $state -PathType Leaf)){throw 'Case 0003 final acceptance state unavailable'}
          $ev=Get-Content -LiteralPath $state -Raw|ConvertFrom-Json
          if([string]::IsNullOrWhiteSpace([string]$ev.revision_id)){throw 'Case 0003 revision_id missing'}
          $bundle=Join-Path $env:CASE0003_WORKSPACE ('.openworker\reviews\'+[string]$ev.revision_id)
          if(-not (Test-Path -LiteralPath $bundle -PathType Container)){throw ('Case 0003 review bundle unavailable: '+$bundle)}
          foreach($required in @('manifest.json','manifest.sha256','review-request.json')){ if(-not (Test-Path -LiteralPath (Join-Path $bundle $required) -PathType Leaf)){throw ('review bundle missing '+$required)} }
          "CASE0003_REVISION_ID=$($ev.revision_id)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CASE0003_REVIEW_BUNDLE=$bundle"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve WorkLedger work code
        env:
          PYTHONPATH: ${{ github.workspace }}\openworker
        run: |
          $ErrorActionPreference='Stop'
          $code = @'
          import os, sqlite3
          from pathlib import Path
          workspace=Path(os.environ['CASE0003_WORKSPACE']); rid=os.environ['CASE0003_REVISION_ID']; db=workspace/'.openworker'/'work-ledger.sqlite'
          con=sqlite3.connect(db)
          try: row=con.execute('SELECT w.code FROM works w JOIN work_revisions r ON r.work_id=w.work_id WHERE r.revision_id=?',(rid,)).fetchone()
          finally: con.close()
          if not row or not str(row[0]).strip(): raise SystemExit('WorkLedger work code unavailable')
          print(str(row[0]).strip())
          '@
          $workCode=($code|python -).Trim()
          if($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($workCode)){throw 'failed to resolve WorkLedger work code'}
          "CASE0003_WORK_CODE=$workCode"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish review bundle through Google Drive API and bind receipt to WorkLedger
        env:
          PYTHONPATH: ${{ github.workspace }}\openworker
          OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN: ${{ secrets.OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $args=@('openworker\scripts\publish_review_bundle_to_drive.py','--workspace',$env:CASE0003_WORKSPACE,'--revision-id',$env:CASE0003_REVISION_ID,'--work-code',$env:CASE0003_WORK_CODE,'--bundle',$env:CASE0003_REVIEW_BUNDLE,'--machine-id',$env:COMPUTERNAME,'--case-id','0003','--run-id',$env:GITHUB_RUN_ID)
          if(-not [string]::IsNullOrWhiteSpace($env:OPENWORKER_REVIEW_DRIVE_FOLDER_ID)){ $args += @('--drive-folder-id',$env:OPENWORKER_REVIEW_DRIVE_FOLDER_ID) }
          & python @args
          if($LASTEXITCODE -ne 0){throw ('Google Drive API review publish failed exit='+$LASTEXITCODE)}

      - name: Verify durable cloud publication receipt and waiting-review state
        env:
          PYTHONPATH: ${{ github.workspace }}\openworker
        run: |
          $ErrorActionPreference='Stop'
          $receipt=Join-Path $env:CASE0003_REVIEW_BUNDLE 'review-publish-receipt.json'
          if(-not (Test-Path -LiteralPath $receipt -PathType Leaf) -or (Get-Item -LiteralPath $receipt).Length -le 0){throw 'review publish receipt missing/empty'}
          $r=Get-Content -LiteralPath $receipt -Raw|ConvertFrom-Json
          if($r.schema_version -ne 'openworker-review-publish-receipt/v1' -or $r.transport -ne 'google-drive-api' -or $r.status -ne 'WAITING_LLM_REVIEW'){throw 'review publish receipt state mismatch'}
          if([string]::IsNullOrWhiteSpace([string]$r.drive_revision_folder_id)){throw 'Drive revision folder id missing'}
          foreach($f in @($r.files)){ if([string]::IsNullOrWhiteSpace([string]$f.drive_file_id) -or [string]::IsNullOrWhiteSpace([string]$f.sha256)){throw 'Drive published file missing cloud id or SHA'} }
          "CASE0003_PUBLISH_RECEIPT=$receipt"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CASE0003_DRIVE_API_PUBLISH_PASS revision=$env:CASE0003_REVISION_ID folder=$($r.drive_revision_folder_id)"

      - name: Record canonical review evidence, release action lease, and pass step
        env:
          PYTHONPATH: ${{ github.workspace }}\openworker
        run: |
          $ErrorActionPreference='Stop'
          $script='openworker\scripts\case_worklist_action.py'
          python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-160' --key review_bundle --value $env:CASE0003_REVIEW_BUNDLE
          python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-160' --key drive_receipt --value $env:CASE0003_PUBLISH_RECEIPT
          python $script complete-action --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-160' --action-id 'openworker.review.publish' --execution-id '${{ steps.worklist.outputs.execution_id }}'
          if($LASTEXITCODE -ne 0){throw 'Case 0003 Drive action lease release failed'}
          python $script pass --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-160'
          if($LASTEXITCODE -ne 0){throw 'Case 0003 Drive worklist evidence/pass failed'}
          Write-Host 'CASE0003_WORKLIST_PASS step=0003-160 next=0003-170'

      - name: Block active Case 0003 Drive step on failure
        if: failure() && steps.worklist.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}\openworker
        run: |
          python openworker\scripts\case_worklist_action.py block-active --workspace-root $env:CASE0003_WORKSPACE --step-id '0003-160' --reason "Drive publication workflow failed in GitHub run $env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_ATTEMPT"

      - name: Upload bounded publication receipt evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: case-0003-drive-api-publication-${{ github.run_id }}
          path: |
            D:\AI-Work\jobs\0003-YUJING-BRIDGE\.openworker\reviews\**\review-publish-receipt.json
            D:\AI-Work\jobs\0003-YUJING-BRIDGE\.openworker\reviews\**\manifest.json
            D:\AI-Work\jobs\0003-YUJING-BRIDGE\.openworker\reviews\**\manifest.sha256
            D:\AI-Work\jobs\0003-YUJING-BRIDGE\.openworker\case-worklist.json
          if-no-files-found: warn
          retention-days: 14
