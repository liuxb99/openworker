name: Dispatch Local Supervisor Command O87

on:
  workflow_dispatch:
    inputs:
      command:
        description: Fixed high-level O87 local supervisor command
        required: true
        type: choice
        options:
          - supervisor_status
          - case_status
          - case_diagnose
          - case_bootstrap
          - case_continue
          - queue_clear
      request_id:
        description: Stable ChatGPT control request id
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'command-requests/o87.json'
  pull_request:
    types: [opened]

permissions:
  contents: write
  actions: read

jobs:
  direct_pr_dispatch:
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.event.pull_request.title, '[openworker-control] case0004_') ||
       github.event.pull_request.title == '[openworker-control] supervisor_status') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, O87]
    timeout-minutes: 2
    concurrency:
      group: openworker-command-transport-o87-dispatch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate PR command and invoke O87 OpenWorker local supervisor
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          $ErrorActionPreference='Stop'
          $title=[string]$env:PR_TITLE
          $body=[string]$env:PR_BODY
          if($title -eq '[openworker-control] case0004_status'){$command='case_status'}
          elseif($title -eq '[openworker-control] case0004_continue'){$command='case_continue'}
          elseif($title -eq '[openworker-control] supervisor_status'){$command='supervisor_status'}
          else{throw "unsupported control PR title=$title"}
          if($body -notmatch '(?im)^requested_by:\s*ChatGPT\s*$'){throw 'control PR must declare requested_by: ChatGPT'}
          if($body -notmatch '(?im)^case_id:\s*0004\s*$'){throw 'control PR must declare case_id: 0004'}
          if($body -notmatch '(?im)^machine:\s*DESKTOP-O87PJNR\s*$'){throw 'control PR must declare machine: DESKTOP-O87PJNR'}
          $requestId="pr-$($env:PR_NUMBER)-$($env:GITHUB_RUN_ID)"
          if($requestId -notmatch '^[A-Za-z0-9._-]{8,128}$'){throw 'invalid generated request id'}
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\run-o87-transient-command.ps1') -Command $command -RequestId $requestId
          if($LASTEXITCODE -ne 0){throw "O87 transient command failed exit=$LASTEXITCODE"}

  ingress:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      command: ${{ steps.request.outputs.command }}
      request_id: ${{ steps.request.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate bounded ChatGPT request
        id: request
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:EVENT_NAME -eq 'workflow_dispatch'){
            $command=[string]$env:INPUT_COMMAND
            $requestId=[string]$env:INPUT_REQUEST_ID
          }elseif($env:EVENT_NAME -eq 'push'){
            $path=Join-Path $env:GITHUB_WORKSPACE 'command-requests\o87.json'
            $req=Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -ErrorAction Stop
            if($req.schema -ne 'openworker.command-request.v1'){throw "unsupported request schema=$($req.schema)"}
            if($req.machine -ine 'DESKTOP-O87PJNR'){throw "unsupported request machine=$($req.machine)"}
            if($req.case_id -ne '0004'){throw "unsupported request case_id=$($req.case_id)"}
            if($req.requested_by -ne 'chatgpt'){throw "unsupported requested_by=$($req.requested_by)"}
            $command=[string]$req.command
            $requestId=[string]$req.request_id
          }else{throw "unsupported event=$env:EVENT_NAME"}
          if(-not $requestId -or $requestId -notmatch '^[A-Za-z0-9._-]{8,128}$'){throw 'invalid request_id'}
          $allowed=@('supervisor_status','case_status','case_diagnose','case_bootstrap','case_continue','queue_clear')
          if($allowed -notcontains $command){throw "unsupported command=$command"}
          "command=$command" >> $env:GITHUB_OUTPUT
          "request_id=$requestId" >> $env:GITHUB_OUTPUT
          $queued=[ordered]@{schema='openworker.command-result.v1';phase='queued_for_o87';request_id=$requestId;command=$command;machine='DESKTOP-O87PJNR';case_id=if($command -like 'case_*'){'0004'}else{$null};transport='github_actions_transient_dispatch';accepted=$false;transport_ok=$false;github_run_id=$env:GITHUB_RUN_ID;github_run_attempt=$env:GITHUB_RUN_ATTEMPT;github_action_used_for_command_transport=$true;github_action_used_for_business_execution=$false;business_completion_claimed=$false;authoritative_business_state='openworker';queued_at=[DateTimeOffset]::UtcNow.ToString('o')}
          $rel="command-results/o87/$requestId/queued.json";$out=Join-Path $env:GITHUB_WORKSPACE ($rel -replace '/','\');New-Item -ItemType Directory -Force -Path (Split-Path $out)|Out-Null
          [IO.File]::WriteAllText($out,($queued|ConvertTo-Json -Depth 20)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          git config user.name 'openworker-command-ingress';git config user.email 'openworker-command-ingress@users.noreply.github.com';git add -- $rel;git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m "receipt: O87 queued $command $requestId";if($LASTEXITCODE -ne 0){throw 'failed to commit queued receipt'}
            $pushed=$false
            for($i=0;$i -lt 3;$i++){git pull --rebase origin main;if($LASTEXITCODE -ne 0){git rebase --abort 2>$null;Start-Sleep -Seconds 1;continue};git push origin HEAD:main;if($LASTEXITCODE -eq 0){$pushed=$true;break};Start-Sleep -Seconds 2}
            if(-not $pushed){throw 'failed to push queued receipt'}
          }

  dispatch:
    if: github.event_name != 'pull_request'
    needs: ingress
    runs-on: [self-hosted, Windows, X64, O87]
    timeout-minutes: 2
    concurrency:
      group: openworker-command-transport-o87-dispatch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Invoke O87 OpenWorker local supervisor
        shell: cmd
        env:
          COMMAND: ${{ needs.ingress.outputs.command }}
          REQUEST_ID: ${{ needs.ingress.outputs.request_id }}
        run: >-
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\run-o87-transient-command.ps1" -Command "%COMMAND%" -RequestId "%REQUEST_ID%"
