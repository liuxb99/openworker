name: Case 0003 Re-review Publish UL7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case-0003-rereview-publish-ul7.yml'

permissions:
  contents: read

concurrency:
  group: case-0003-rereview-publish-ul7
  cancel-in-progress: false

env:
  CASE0003_ASSIGNED_HOST: DESKTOP-UL7V2VV
  CASE0003_WORKSPACE: 'D:\AI-Work\jobs\0003-YUJING-BRIDGE'
  CASE0003_REVISION_ID: rev_6e6e40bd0c5341f6b81a340bf719f237
  CASE0003_REPAIR_STEP: R-0003-190-REVIEW-6e6e40bd0c53
  OPENWORKER_REVIEW_DRIVE_FOLDER_ID: ${{ vars.OPENWORKER_REVIEW_DRIVE_FOLDER_ID }}
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  publish-rereview:
    runs-on: [self-hosted, Windows, X64, UL7]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: openworker

      - name: Verify host and exact fresh revision
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine $env:CASE0003_ASSIGNED_HOST){throw 'Case 0003 host mismatch'}
          $state=Join-Path $env:CASE0003_WORKSPACE 'acceptance\openworker-final\work-ledger-final-acceptance.json'
          if(-not (Test-Path -LiteralPath $state -PathType Leaf)){throw 'Case 0003 final acceptance state missing'}
          $ev=Get-Content -LiteralPath $state -Raw|ConvertFrom-Json
          if([string]$ev.revision_id -ne $env:CASE0003_REVISION_ID){throw ('fresh revision drift: '+[string]$ev.revision_id)}
          if([string]$ev.status -ne 'WAITING_DRIVE_HANDOFF' -and [string]$ev.status -ne 'WAITING_LLM_REVIEW'){throw ('fresh revision not reviewable: '+[string]$ev.status)}
          $bundle=Join-Path $env:CASE0003_WORKSPACE ('.openworker\reviews\'+$env:CASE0003_REVISION_ID)
          foreach($required in @('manifest.json','manifest.sha256','review-request.json')){if(-not (Test-Path -LiteralPath (Join-Path $bundle $required) -PathType Leaf)){throw ('review bundle missing '+$required)}}
          $sha=(Get-Content -LiteralPath (Join-Path $bundle 'manifest.sha256') -Raw).Trim().ToLowerInvariant()
          if($sha -notmatch '^[0-9a-f]{64}$'){throw 'fresh manifest SHA invalid'}
          "CASE0003_REVIEW_BUNDLE=$bundle"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CASE0003_MANIFEST_SHA=$sha"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Govern re-review repair and lease publication
        id: govern
        run: |
          $ErrorActionPreference='Stop'
          $script='openworker\scripts\case_worklist_action.py'
          $wlPath=Join-Path $env:CASE0003_WORKSPACE '.openworker\case-worklist.json'
          $wl=Get-Content -LiteralPath $wlPath -Raw|ConvertFrom-Json
          $step180=@($wl.steps|Where-Object{$_.step_id -eq '0003-180'})[0]
          if([string]$step180.status -ne 'PASSED'){throw ('0003-180 not closed: '+[string]$step180.status)}
          $step190=@($wl.steps|Where-Object{$_.step_id -eq '0003-190'})[0]
          if([string]$step190.status -eq 'READY'){
            python $script block-active --workspace-root $env:CASE0003_WORKSPACE --step-id 0003-190 --reason 'Delivery forbidden until fresh rework revision receives ChatGPT PASS'
            if($LASTEXITCODE -ne 0){throw 'failed to block 0003-190 for re-review'}
          } elseif([string]$step190.status -ne 'BLOCKED'){
            throw ('unexpected 0003-190 status '+[string]$step190.status)
          }
          $wl=Get-Content -LiteralPath $wlPath -Raw|ConvertFrom-Json
          $repair=@($wl.steps|Where-Object{$_.step_id -eq $env:CASE0003_REPAIR_STEP})
          if($repair.Count -eq 0){
            python $script add-repair --workspace-root $env:CASE0003_WORKSPACE --parent-step-id 0003-190 --step-id $env:CASE0003_REPAIR_STEP --title 'Re-review repaired SceneX revision before delivery' --allowed-action openworker.review.publish --allowed-action openworker.review.inspect_drive --allowed-action openworker.review.apply --acceptance rework_revision --acceptance review_bundle --acceptance drive_receipt --acceptance review_receipt --acceptance review_decision --acceptance ledger_status
            if($LASTEXITCODE -ne 0){throw 'failed to add governed re-review repair'}
          }
          $wl=Get-Content -LiteralPath $wlPath -Raw|ConvertFrom-Json
          $repair=@($wl.steps|Where-Object{$_.step_id -eq $env:CASE0003_REPAIR_STEP})[0]
          if([string]$repair.status -eq 'READY'){
            $exec="github:$env:GITHUB_RUN_ID:$env:GITHUB_RUN_ATTEMPT:rereview-publish"
            python $script start --workspace-root $env:CASE0003_WORKSPACE --step-id $env:CASE0003_REPAIR_STEP --action-id openworker.review.publish --execution-id $exec
            if($LASTEXITCODE -ne 0){throw 'failed to lease re-review publication'}
            python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id $env:CASE0003_REPAIR_STEP --key rework_revision --value $env:CASE0003_REVISION_ID
            python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id $env:CASE0003_REPAIR_STEP --key review_bundle --value $env:CASE0003_REVIEW_BUNDLE
            "execution_id=$exec" >> $env:GITHUB_OUTPUT
          } elseif([string]$repair.status -eq 'RUNNING'){
            $exec=[string]$repair.evidence.__openworker_active_execution
            if([string]$repair.evidence.__openworker_active_action -ne 'openworker.review.publish'){throw 're-review repair running another action'}
            "execution_id=$exec" >> $env:GITHUB_OUTPUT
          } else {
            throw ('re-review repair not publishable: '+[string]$repair.status)
          }

      - name: Resolve WorkLedger work code
        run: |
          $ErrorActionPreference='Stop'
          $code=@'
          import os, sqlite3
          from pathlib import Path
          ws=Path(os.environ['CASE0003_WORKSPACE']); rid=os.environ['CASE0003_REVISION_ID']
          con=sqlite3.connect(ws/'.openworker'/'work-ledger.sqlite')
          try: row=con.execute('SELECT w.code FROM works w JOIN work_revisions r ON r.work_id=w.work_id WHERE r.revision_id=?',(rid,)).fetchone()
          finally: con.close()
          if not row: raise SystemExit('work code unavailable')
          print(row[0])
          '@
          $workCode=($code|python -).Trim()
          if($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($workCode)){throw 'failed to resolve work code'}
          "CASE0003_WORK_CODE=$workCode"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish fresh re-review bundle through Google Drive API
        env:
          PYTHONPATH: ${{ github.workspace }}\openworker
          OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN: ${{ secrets.OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $args=@('openworker\scripts\publish_review_bundle_to_drive.py','--workspace',$env:CASE0003_WORKSPACE,'--revision-id',$env:CASE0003_REVISION_ID,'--work-code',$env:CASE0003_WORK_CODE,'--bundle',$env:CASE0003_REVIEW_BUNDLE,'--machine-id',$env:COMPUTERNAME,'--case-id','0003','--run-id',$env:GITHUB_RUN_ID)
          if(-not [string]::IsNullOrWhiteSpace($env:OPENWORKER_REVIEW_DRIVE_FOLDER_ID)){$args+=@('--drive-folder-id',$env:OPENWORKER_REVIEW_DRIVE_FOLDER_ID)}
          & python @args
          if($LASTEXITCODE -ne 0){throw ('re-review Drive publication failed exit='+$LASTEXITCODE)}

      - name: Bind publication receipt and release publication action
        run: |
          $ErrorActionPreference='Stop'
          $script='openworker\scripts\case_worklist_action.py'
          $receipt=Join-Path $env:CASE0003_REVIEW_BUNDLE 'review-publish-receipt.json'
          if(-not (Test-Path -LiteralPath $receipt -PathType Leaf)){throw 're-review publish receipt missing'}
          $r=Get-Content -LiteralPath $receipt -Raw|ConvertFrom-Json
          if([string]$r.status -ne 'WAITING_LLM_REVIEW' -or [string]$r.transport -ne 'google-drive-api'){throw 're-review publish receipt invalid'}
          if([string]::IsNullOrWhiteSpace([string]$r.drive_revision_folder_id)){throw 're-review Drive folder id missing'}
          python $script record --workspace-root $env:CASE0003_WORKSPACE --step-id $env:CASE0003_REPAIR_STEP --key drive_receipt --value $receipt
          python $script complete-action --workspace-root $env:CASE0003_WORKSPACE --step-id $env:CASE0003_REPAIR_STEP --action-id openworker.review.publish --execution-id '${{ steps.govern.outputs.execution_id }}'
          if($LASTEXITCODE -ne 0){throw 'failed to release re-review publication action'}
          Write-Host "CASE0003_REREVIEW_PUBLISHED revision=$env:CASE0003_REVISION_ID folder=$($r.drive_revision_folder_id) manifest=$env:CASE0003_MANIFEST_SHA"

      - name: Upload bounded re-review governance evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: case-0003-rereview-publication-${{ github.run_id }}
          path: |
            D:\AI-Work\jobs\0003-YUJING-BRIDGE\.openworker\case-worklist.json
            D:\AI-Work\jobs\0003-YUJING-BRIDGE\.openworker\reviews\rev_6e6e40bd0c5341f6b81a340bf719f237\review-publish-receipt.json
            D:\AI-Work\jobs\0003-YUJING-BRIDGE\.openworker\reviews\rev_6e6e40bd0c5341f6b81a340bf719f237\manifest.sha256
          if-no-files-found: warn
          retention-days: 14
