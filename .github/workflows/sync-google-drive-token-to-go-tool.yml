name: Sync Google Drive Token To Go Tool

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-google-drive-token-to-go-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: sync-${{ matrix.machine }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: O87
            host: DESKTOP-O87PJNR
            label: O87
          - machine: ODA
            host: DESKTOP-ODAQN0D
            label: ODA
          - machine: UL7
            host: DESKTOP-UL7V2VV
            label: UL7
    runs-on: [self-hosted, Windows, X64, '${{ matrix.label }}']
    timeout-minutes: 10
    env:
      EXPECTED_HOST: ${{ matrix.host }}
      GTR_SHARED_GOOGLE_DRIVE_ACCESS_TOKEN: ${{ secrets.OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN }}
      GTR_CREDENTIAL_DB_PATH: C:\ProgramData\go-tool-runtime\runtime.db
    steps:
      - name: Verify fixed machine
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ine $env:EXPECTED_HOST) {
            throw "wrong host: expected=$env:EXPECTED_HOST actual=$env:COMPUTERNAME"
          }
          if ([string]::IsNullOrWhiteSpace($env:GTR_SHARED_GOOGLE_DRIVE_ACCESS_TOKEN)) {
            throw "OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN secret is unavailable"
          }
          Write-Host "credential target host verified: $env:COMPUTERNAME"

      - name: Clone latest go-tool without changing gh auth
        shell: powershell
        run: |
          $repoDir = Join-Path $env:RUNNER_TEMP "go-tool-runtime-drive-credential-sync"
          if (Test-Path $repoDir) { Remove-Item -Recurse -Force $repoDir }
          gh repo clone liuxb99/go-tool-runtime $repoDir -- --depth 1
          "GTR_SYNC_REPO=$repoDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import additive Google Drive credential slot
        shell: powershell
        run: |
          Push-Location $env:GTR_SYNC_REPO
          try {
            go run ./cmd/gtr-credential-import `
              -db $env:GTR_CREDENTIAL_DB_PATH `
              -provider google_drive `
              -key OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN `
              -env GTR_SHARED_GOOGLE_DRIVE_ACCESS_TOKEN
          } finally {
            Pop-Location
          }

      - name: Compile credential and Drive bindings
        shell: powershell
        run: |
          Push-Location $env:GTR_SYNC_REPO
          try {
            go test ./internal/execution ./internal/localexec -run 'TestNamedLocalCredentialsKeepGitHubAndGoogleDriveIsolated|TestDriveReviewPublishInvokesCanonicalOpenWorkerScript' -count=1
          } finally {
            Pop-Location
          }
