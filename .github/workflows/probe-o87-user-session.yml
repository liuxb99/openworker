name: Probe O87 User Session Bridge

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.event.pull_request.title == '[openworker-control] probe_o87_user_session' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, O87]
    timeout-minutes: 5
    steps:
      - name: Probe bounded interactive-token bridge
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine 'DESKTOP-O87PJNR'){throw "wrong host=$env:COMPUTERNAME"}
          $driveProcs=@(Get-CimInstance Win32_Process|Where-Object{$_.Name -eq 'GoogleDriveFS.exe'})
          if($driveProcs.Count -lt 1){throw 'GoogleDriveFS process unavailable'}
          $driveSessionIds=@($driveProcs|Select-Object -ExpandProperty SessionId -Unique)
          if($driveSessionIds.Count -ne 1){throw "expected exactly one GoogleDriveFS session id, got $($driveSessionIds.Count)"}
          $driveSession=[int]$driveSessionIds[0]
          $sids=@()
          foreach($p in $driveProcs){
            try {
              $logons=@(Get-CimInstance -Query ("ASSOCIATORS OF {Win32_Process.Handle='"+$p.ProcessId+"'} WHERE AssocClass=Win32_SessionProcess ResultClass=Win32_LogonSession") -ErrorAction Stop)
              foreach($logon in $logons){
                $accounts=@(Get-CimInstance -Query ("ASSOCIATORS OF {Win32_LogonSession.LogonId='"+$logon.LogonId+"'} WHERE AssocClass=Win32_LoggedOnUser ResultClass=Win32_Account") -ErrorAction Stop)
                foreach($a in $accounts){if(-not [string]::IsNullOrWhiteSpace([string]$a.SID)){$sids += [string]$a.SID}}
              }
            } catch {}
          }
          $sids=@($sids|Where-Object{$_ -match '^S-1-5-21-'}|Select-Object -Unique)
          Write-Host ('OPENWORKER_O87_DRIVE_LOGON_ASSOC session_id='+$driveSession+' sid_count='+$sids.Count)
          if($sids.Count -ne 1){throw "expected exactly one non-system Drive logon SID, got $($sids.Count)"}
          $sid=$sids[0]
          $script='C:\ProgramData\OpenWorker\user-session-drive-probe.ps1'
          $receipt='C:\ProgramData\OpenWorker\user-session-drive-probe.json'
          New-Item -ItemType Directory -Force -Path (Split-Path $script)|Out-Null
          @"
          `$ErrorActionPreference='Stop'
          `$ok=`$false; `$entries=@(); `$err=''
          try{`$entries=@(Get-ChildItem -LiteralPath 'G:\' -Force -ErrorAction Stop|Select-Object -First 20 -ExpandProperty Name); `$ok=`$true}catch{`$err=`$_.Exception.Message}
          `$r=[ordered]@{schema='openworker.user-session-drive-probe/v8';machine=`$env:COMPUTERNAME;g_accessible=`$ok;entry_count=`$entries.Count;error=`$err;observed_at=[DateTimeOffset]::UtcNow.ToString('o')}
          [IO.File]::WriteAllText('$receipt',(`$r|ConvertTo-Json -Depth 6)+[Environment]::NewLine,[Text.UTF8Encoding]::new(`$false))
          "@|Set-Content -LiteralPath $script -Encoding utf8
          Remove-Item -LiteralPath $receipt -Force -ErrorAction SilentlyContinue
          $task='OpenWorker-O87-UserSessionDriveProbe'
          Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
          $action=New-ScheduledTaskAction -Execute 'powershell.exe' -Argument ('-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "'+$script+'"')
          $principal=New-ScheduledTaskPrincipal -UserId $sid -LogonType Interactive -RunLevel Highest
          Register-ScheduledTask -TaskName $task -Action $action -Principal $principal -Force -ErrorAction Stop|Out-Null
          Write-Host 'OPENWORKER_O87_INTERACTIVE_PRINCIPAL_REGISTERED=true'
          try {
            Start-ScheduledTask -TaskName $task
            $deadline=[DateTime]::UtcNow.AddSeconds(45)
            while([DateTime]::UtcNow -lt $deadline -and -not(Test-Path -LiteralPath $receipt -PathType Leaf)){Start-Sleep -Milliseconds 500}
            if(-not(Test-Path -LiteralPath $receipt -PathType Leaf)){throw 'interactive probe receipt timeout'}
            $r=Get-Content -LiteralPath $receipt -Raw|ConvertFrom-Json
            Write-Host "OPENWORKER_O87_USER_SESSION_BRIDGE g_accessible=$($r.g_accessible) entry_count=$($r.entry_count) error=$($r.error)"
            if(-not [bool]$r.g_accessible){throw 'Drive WMI-associated SID cannot access G drive'}
          } finally {
            Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
          }
