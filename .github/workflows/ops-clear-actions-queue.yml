name: OPS Clear Actions Queue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/triggers/clear-actions-queue.txt'
      - '.github/workflows/ops-clear-actions-queue.yml'

permissions:
  actions: write
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cancel and verify every other non-terminal run
        shell: bash
        run: |
          set -euo pipefail
          current="${GITHUB_RUN_ID}"
          state="${RUNNER_TEMP}/queue-clear.json"
          list_runs() {
            gh api --paginate --slurp "repos/${GH_REPO}/actions/runs?per_page=100" \
              | jq --arg current "${current}" '[.[].workflow_runs[] | select(.status != "completed" and (.id|tostring) != $current) | {id,name,status}] | unique_by(.id)'
          }
          before="$(list_runs)"
          cancelled='[]'
          remaining="${before}"
          for attempt in $(seq 1 84); do
            while IFS= read -r id; do
              [[ -z "${id}" ]] && continue
              if gh api -X POST "repos/${GH_REPO}/actions/runs/${id}/cancel" >/dev/null 2>&1 \
                || gh api -X POST "repos/${GH_REPO}/actions/runs/${id}/force-cancel" >/dev/null 2>&1; then
                cancelled="$(jq --argjson id "${id}" '.+[$id]|unique' <<<"${cancelled}")"
              fi
            done < <(jq -r '.[].id' <<<"${remaining}")
            sleep 5
            remaining="$(list_runs)"
            echo "QUEUE_CLEAR_POLL attempt=${attempt} remaining=$(jq length <<<"${remaining}")"
            [[ "$(jq length <<<"${remaining}")" == 0 ]] && break
          done
          outcome=PASS
          [[ "$(jq length <<<"${remaining}")" == 0 ]] || outcome=FAIL
          jq -n --arg run_id "${current}" --arg source_sha "${GITHUB_SHA}" --arg outcome "${outcome}" \
            --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson before "${before}" \
            --argjson cancelled "${cancelled}" --argjson remaining "${remaining}" \
            '{schema_version:"openworker-queue-clear-evidence/v2",run_id:$run_id,source_sha:$source_sha,nonterminal_before:$before,cancelled_ids:$cancelled,remaining_after:$remaining,outcome:$outcome,verified_at:$verified_at}' > "${state}"
          [[ "${outcome}" == PASS ]]
      - name: Publish queue-clear evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/ops
          cp "${RUNNER_TEMP}/queue-clear.json" evidence/ops/latest-queue-clear.json
          git config user.name 'openworker-ops-bot'
          git config user.email '121744662+liuxb99@users.noreply.github.com'
          git add evidence/ops/latest-queue-clear.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(ops): publish latest queue clear'
          for attempt in $(seq 1 5); do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
