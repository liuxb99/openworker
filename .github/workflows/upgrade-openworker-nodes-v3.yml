name: Upgrade OpenWorker Nodes V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-openworker-nodes-v3.yml'
      - 'go-runtime/**'
      - 'scripts/install_openworker_node_service.ps1'

permissions:
  contents: write

concurrency:
  group: openworker-node-upgrade-v3
  cancel-in-progress: true

jobs:
  upgrade:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - node: ul7
            label: UL7
            machine: DESKTOP-UL7V2VV
            capabilities: case0003,bridge,blender,scenex,engineering,drive-review
          - node: o87
            label: O87
            machine: DESKTOP-O87PJNR
            capabilities: case0004,dwg,story-index,engineering
          - node: oda
            label: ODA
            machine: DESKTOP-ODAQN0D
            capabilities: case0002,case0005,comfyx,minimax-h3,video,storyboard,presentation,local-supervisor
    runs-on: [self-hosted, Windows, X64, ${{ matrix.label }}]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4

      - name: Verify fixed machine
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine '${{ matrix.machine }}'){throw "wrong host $env:COMPUTERNAME expected=${{ matrix.machine }}"}
          Write-Host "OPENWORKER_UPGRADE_CLAIM node=${{ matrix.node }} machine=$env:COMPUTERNAME"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go-runtime/go.sum

      - name: Build install verify and persist canonical receipts
        env:
          GH_TOKEN: ${{ github.token }}
          NODE: ${{ matrix.node }}
          MACHINE: ${{ matrix.machine }}
          CAPABILITIES: ${{ matrix.capabilities }}
        run: |
          $ErrorActionPreference='Stop'
          $lockDir='C:\ProgramData\OpenWorker'
          New-Item -ItemType Directory -Force -Path $lockDir | Out-Null
          $lockPath=Join-Path $lockDir 'upgrade-v3.lock'
          $lock=$null
          try {
            try { $lock=[IO.File]::Open($lockPath,[IO.FileMode]::OpenOrCreate,[IO.FileAccess]::ReadWrite,[IO.FileShare]::None) }
            catch { throw "unexpected duplicate upgrade on fixed node=$env:NODE machine=$env:MACHINE" }

            function Put-Receipt([string]$phase,[hashtable]$payload){
              $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
              $path="case-evidence/node-upgrade/$env:GITHUB_SHA/$env:NODE-$($phase.ToLowerInvariant()).json"
              $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path"
              $readUri='{0}?ref={1}' -f $uri,[uri]::EscapeDataString($env:GITHUB_REF_NAME)
              $json=$payload | ConvertTo-Json -Depth 20 -Compress
              $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
              for($attempt=1;$attempt -le 8;$attempt++){
                $sha=$null
                try { $existing=Invoke-RestMethod -Uri $readUri -Headers $headers; $sha=$existing.sha }
                catch {
                  $status=$null
                  try { $status=$_.Exception.Response.StatusCode.value__ } catch {}
                  if($status -ne 404){ throw }
                }
                $body=@{message="receipt: $env:NODE $phase $env:GITHUB_SHA";content=$b64;branch=$env:GITHUB_REF_NAME}
                if($sha){$body.sha=$sha}
                try {
                  Invoke-RestMethod -Method Put -Uri $uri -Headers $headers -ContentType 'application/json' -Body ($body|ConvertTo-Json -Compress) | Out-Null
                  return
                } catch {
                  $status=$null
                  try { $status=$_.Exception.Response.StatusCode.value__ } catch {}
                  if($status -ne 409 -or $attempt -eq 8){ throw }
                  Start-Sleep -Milliseconds (250 * $attempt)
                }
              }
            }

            Put-Receipt 'ACCEPTED' ([ordered]@{schema='openworker/node-upgrade-receipt/v3';phase='ACCEPTED';node=$env:NODE;machine=$env:MACHINE;runner_name=$env:RUNNER_NAME;target_commit=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;accepted_at=[DateTimeOffset]::UtcNow.ToString('o')})

            $already=$false
            try {
              $s=Invoke-RestMethod 'http://127.0.0.1:8787/v1/node/status' -TimeoutSec 3
              if($s.service.running_commit -eq $env:GITHUB_SHA -and $s.service.upgrade_verified){$already=$true}
            } catch {}

            if(-not $already){
              Push-Location go-runtime
              go mod tidy
              $build=[DateTime]::UtcNow.ToString('o')
              go build -ldflags "-X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.Version=p2-node -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.Commit=$env:GITHUB_SHA -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.TargetCommit=$env:GITHUB_SHA -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.BuildTime=$build" -o openworker-node.exe ./cmd/openworker-node
              if($LASTEXITCODE -ne 0){throw "go build failed exit=$LASTEXITCODE"}
              Pop-Location
              & "$env:GITHUB_WORKSPACE\scripts\install_openworker_node_service.ps1" -SourceExe "$env:GITHUB_WORKSPACE\go-runtime\openworker-node.exe" -Workers 4 -Capabilities $env:CAPABILITIES -Listen '127.0.0.1:8787'
            }

            $s=Invoke-RestMethod 'http://127.0.0.1:8787/v1/node/status' -TimeoutSec 10
            if($s.machine -ine $env:MACHINE){throw "node machine=$($s.machine) expected=$env:MACHINE"}
            if($s.service.running_commit -ne $env:GITHUB_SHA -or $s.service.target_commit -ne $env:GITHUB_SHA -or -not $s.service.upgrade_verified){throw "upgrade not verified: $($s.service|ConvertTo-Json -Compress)"}

            Put-Receipt 'VERIFIED' ([ordered]@{schema='openworker/node-upgrade-receipt/v3';phase='VERIFIED';node=$env:NODE;machine=$s.machine;runner_name=$env:RUNNER_NAME;target_commit=$env:GITHUB_SHA;running_commit=$s.service.running_commit;upgrade_status=$s.service.upgrade_status;upgrade_verified=$s.service.upgrade_verified;service_started_at=$s.service.service_started_at;run_id=$env:GITHUB_RUN_ID;verified_at=[DateTimeOffset]::UtcNow.ToString('o')})
            Write-Host "OPENWORKER_UPGRADE_VERIFIED node=$env:NODE machine=$env:MACHINE commit=$env:GITHUB_SHA"
          }
          finally { if($lock){$lock.Dispose()} }
