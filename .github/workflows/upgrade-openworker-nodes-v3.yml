name: Upgrade OpenWorker Nodes V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-openworker-nodes-v3.yml'
      - 'go-runtime/**'
      - 'scripts/install_openworker_node_service.ps1'

permissions:
  contents: write

concurrency:
  group: openworker-node-upgrade-v3
  cancel-in-progress: true

jobs:
  upgrade:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4

      - name: Detect machine and configuration
        id: detect
        run: |
          $ErrorActionPreference='Stop'
          $m=$env:COMPUTERNAME.ToUpperInvariant()
          switch($m){
            'DESKTOP-UL7V2VV' { $node='ul7'; $caps='case0003,bridge,blender,scenex,engineering,drive-review' }
            'DESKTOP-O87PJNR' { $node='o87'; $caps='case0004,dwg,story-index,engineering' }
            'DESKTOP-ODAQN0D' { $node='oda'; $caps='case0002,case0005,comfyx,minimax-h3,video,storyboard,presentation,local-supervisor' }
            default { Write-Host "OPENWORKER_UPGRADE_SKIP_UNKNOWN_MACHINE machine=$m"; "eligible=false" >> $env:GITHUB_OUTPUT; exit 0 }
          }
          "eligible=true" >> $env:GITHUB_OUTPUT
          "node=$node" >> $env:GITHUB_OUTPUT
          "machine=$m" >> $env:GITHUB_OUTPUT
          "capabilities=$caps" >> $env:GITHUB_OUTPUT
          Write-Host "OPENWORKER_UPGRADE_ROUTE authority=COMPUTERNAME node=$node machine=$m slot=${{ matrix.slot }}"

      - uses: actions/setup-go@v5
        if: steps.detect.outputs.eligible == 'true'
        with:
          go-version: '1.23.x'
          cache-dependency-path: go-runtime/go.sum

      - name: Build install verify and persist canonical receipts
        if: steps.detect.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NODE: ${{ steps.detect.outputs.node }}
          MACHINE: ${{ steps.detect.outputs.machine }}
          CAPABILITIES: ${{ steps.detect.outputs.capabilities }}
        run: |
          $ErrorActionPreference='Stop'
          $lockDir='C:\ProgramData\OpenWorker'
          New-Item -ItemType Directory -Force -Path $lockDir | Out-Null
          $lockPath=Join-Path $lockDir 'upgrade-v3.lock'
          $lock=$null
          try {
            try { $lock=[IO.File]::Open($lockPath,[IO.FileMode]::OpenOrCreate,[IO.FileAccess]::ReadWrite,[IO.FileShare]::None) }
            catch { Write-Host "OPENWORKER_UPGRADE_DUPLICATE_SKIP node=$env:NODE machine=$env:MACHINE slot=${{ matrix.slot }}"; exit 0 }

            function Put-Receipt([string]$phase,[hashtable]$payload){
              $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
              $path="case-evidence/node-upgrade/$env:GITHUB_SHA/$env:NODE-$($phase.ToLowerInvariant()).json"
              $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path"
              $readUri='{0}?ref={1}' -f $uri,[uri]::EscapeDataString($env:GITHUB_REF_NAME)
              $json=$payload | ConvertTo-Json -Depth 20 -Compress
              $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
              for($attempt=1;$attempt -le 8;$attempt++){
                $sha=$null
                try { $existing=Invoke-RestMethod -Uri $readUri -Headers $headers; $sha=$existing.sha } catch { $status=$null;try{$status=$_.Exception.Response.StatusCode.value__}catch{};if($status -ne 404){throw} }
                $body=@{message="receipt: $env:NODE $phase $env:GITHUB_SHA";content=$b64;branch=$env:GITHUB_REF_NAME};if($sha){$body.sha=$sha}
                try { Invoke-RestMethod -Method Put -Uri $uri -Headers $headers -ContentType 'application/json' -Body ($body|ConvertTo-Json -Compress) | Out-Null; return }
                catch { $status=$null;try{$status=$_.Exception.Response.StatusCode.value__}catch{};if($status -ne 409 -or $attempt -eq 8){throw};Start-Sleep -Milliseconds (250*$attempt) }
              }
            }

            Put-Receipt 'ACCEPTED' ([ordered]@{schema='openworker/node-upgrade-receipt/v4';phase='ACCEPTED';routing_authority='COMPUTERNAME';node=$env:NODE;machine=$env:MACHINE;runner_name=$env:RUNNER_NAME;target_commit=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;slot='${{ matrix.slot }}';accepted_at=[DateTimeOffset]::UtcNow.ToString('o')})

            $already=$false
            try { $s=Invoke-RestMethod 'http://127.0.0.1:8787/v1/node/status' -TimeoutSec 3; if($s.service.running_commit -eq $env:GITHUB_SHA -and $s.service.upgrade_verified){$already=$true} } catch {}
            if(-not $already){
              Push-Location go-runtime
              go mod tidy
              $build=[DateTime]::UtcNow.ToString('o')
              go build -ldflags "-X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.Version=p2-node -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.Commit=$env:GITHUB_SHA -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.TargetCommit=$env:GITHUB_SHA -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.BuildTime=$build" -o openworker-node.exe ./cmd/openworker-node
              if($LASTEXITCODE -ne 0){throw "go build failed exit=$LASTEXITCODE"}
              Pop-Location
              & "$env:GITHUB_WORKSPACE\scripts\install_openworker_node_service.ps1" -SourceExe "$env:GITHUB_WORKSPACE\go-runtime\openworker-node.exe" -Workers 4 -Capabilities $env:CAPABILITIES -Listen '127.0.0.1:8787'
            }

            $s=Invoke-RestMethod 'http://127.0.0.1:8787/v1/node/status' -TimeoutSec 10
            if($s.machine -ine $env:MACHINE){throw "node machine=$($s.machine) expected=$env:MACHINE"}
            if($s.service.running_commit -ne $env:GITHUB_SHA -or $s.service.target_commit -ne $env:GITHUB_SHA -or -not $s.service.upgrade_verified){throw "upgrade not verified: $($s.service|ConvertTo-Json -Compress)"}
            Put-Receipt 'VERIFIED' ([ordered]@{schema='openworker/node-upgrade-receipt/v4';phase='VERIFIED';routing_authority='COMPUTERNAME';node=$env:NODE;machine=$s.machine;runner_name=$env:RUNNER_NAME;target_commit=$env:GITHUB_SHA;running_commit=$s.service.running_commit;upgrade_status=$s.service.upgrade_status;upgrade_verified=$s.service.upgrade_verified;service_started_at=$s.service.service_started_at;run_id=$env:GITHUB_RUN_ID;slot='${{ matrix.slot }}';verified_at=[DateTimeOffset]::UtcNow.ToString('o')})
          }
          finally { if($lock){$lock.Dispose()} }

      - name: Case 0005 bootstrap through verified ODA node transport
        if: steps.detect.outputs.node == 'oda' && contains(github.event.head_commit.message, '[case0005-bootstrap-through-upgrade]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $claim='C:\ProgramData\OpenWorker\case0005-bootstrap-through-upgrade.lock'
          $claimed=$false
          try {
            $fs=[IO.File]::Open($claim,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
            $fs.Dispose(); $claimed=$true
          } catch {}
          if(-not $claimed){ Write-Host 'CASE0005_UPGRADE_TRANSPORT_DUPLICATE_SKIP'; exit 0 }
          try {
            & "$env:GITHUB_WORKSPACE\scripts\case0005_resident_bootstrap.ps1"
            $outcomePath='C:\ProgramData\OpenWorker\node\case0005-last-bootstrap-outcome.json'
            $outcome=$null
            if(Test-Path -LiteralPath $outcomePath -PathType Leaf){ $outcome=Get-Content -Raw -LiteralPath $outcomePath }
            if(-not $outcome){
              $outcome=([ordered]@{schema='openworker/case0005-bootstrap-upgrade-transport/v1';case_id='0005';machine=$env:COMPUTERNAME;succeeded=$false;stage='missing_script_outcome';reason='case0005 resident bootstrap produced no durable outcome';observed_at=[DateTimeOffset]::UtcNow.ToString('o');run_id=$env:GITHUB_RUN_ID}|ConvertTo-Json -Depth 10 -Compress)
            }
            $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
            function Put([string]$path,[string]$content,[string]$message){
              $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path"
              $readUri='{0}?ref={1}' -f $uri,[uri]::EscapeDataString($env:GITHUB_REF_NAME)
              $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($content))
              for($i=1;$i -le 10;$i++){
                $sha=$null
                try{$e=Invoke-RestMethod -Uri $readUri -Headers $headers;$sha=$e.sha}catch{$st=$null;try{$st=$_.Exception.Response.StatusCode.value__}catch{};if($st -ne 404){throw}}
                $body=@{message=$message;content=$b64;branch=$env:GITHUB_REF_NAME};if($sha){$body.sha=$sha}
                try{Invoke-RestMethod -Method Put -Uri $uri -Headers $headers -ContentType 'application/json' -Body ($body|ConvertTo-Json -Compress)|Out-Null;return}catch{$st=$null;try{$st=$_.Exception.Response.StatusCode.value__}catch{};if($st -ne 409 -or $i -eq 10){throw};Start-Sleep -Milliseconds (250*$i)}
              }
            }
            Put 'evidence/case0005/latest-bootstrap-result.json' $outcome 'case0005: publish bootstrap via verified ODA transport'
            $obj=$outcome|ConvertFrom-Json
            if([bool]$obj.succeeded){
              $local='D:\AI-Work\jobs\0005-SNOW-WHITE\evidence\case0005-resident-bootstrap.json'
              if(-not(Test-Path -LiteralPath $local -PathType Leaf)){throw "missing local bootstrap receipt $local"}
              $r=Get-Content -Raw -LiteralPath $local|ConvertFrom-Json
              $ack=[ordered]@{schema='openworker/case0005-bootstrap-ack/v5';case_id='0005';machine='DESKTOP-ODAQN0D';workspace_root='D:\AI-Work\jobs\0005-SNOW-WHITE';accepted=[bool]$r.ack.job.accepted;work_id=[string]$r.ack.job.id;authority='openworker-local-supervisor';routing_authority='COMPUTERNAME';transport='verified-node-upgrade';github_action_used_for_business_execution=$false;run_id=$env:GITHUB_RUN_ID;observed_at=[DateTimeOffset]::UtcNow.ToString('o')}
              Put 'evidence/case0005/latest-bootstrap-ack.json' ($ack|ConvertTo-Json -Depth 10 -Compress) 'case0005: record bootstrap ack via verified ODA transport'
            }
            if($LASTEXITCODE -ne 0 -or -not [bool]$obj.succeeded){throw "Case 0005 bootstrap failed; authoritative result published"}
          }
          finally { Remove-Item -LiteralPath $claim -Force -ErrorAction SilentlyContinue }
