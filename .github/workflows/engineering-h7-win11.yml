name: Engineering H7 Unified Harness Win11

on:
  push:
    branches:
      - engineering-h7-unified
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openworker-engineering-h7-unified-win11
  cancel-in-progress: true

jobs:
  h7-unified:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    steps:
      - name: Runner identity
        run: |
          echo machine=%COMPUTERNAME%
          ver
          python --version
          git --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install focused runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile unified H7 runtime modules
        run: |
          python -m py_compile coworker\runtimes\tool_runtime_bootstrap.py coworker\runtimes\engineering_scope.py coworker\runtimes\engineering_harness.py coworker\runtimes\engineering_host.py coworker\runtimes\harness.py coworker\runtimes\harness_jobs.py coworker\runtimes\harness_managed.py coworker\engineering_cli.py

      - name: H7 authority bootstrap and host tests
        run: python -m pytest -q tests\runtimes\test_tool_runtime_bootstrap.py tests\runtimes\test_engineering_scope.py tests\runtimes\test_engineering_harness_bootstrap.py tests\runtimes\test_engineering_host.py

      - name: H7 managed job and cancellation tests
        run: python -m pytest -q tests\runtimes\test_harness_jobs.py tests\runtimes\test_harness_managed.py

      - name: Harness non-regression tests
        run: python -m pytest -q tests\runtimes\test_runtime_seam.py tests\runtimes\test_harness_runtime.py tests\runtimes\test_harness_engineering_tools.py tests\runtimes\test_harness_context_ingress.py tests\runtimes\test_harness_permissions.py tests\runtimes\test_harness_sessions.py

      - name: One-command CLI entrypoint smoke
        run: |
          openworker-engineering --help
