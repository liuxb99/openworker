name: Smoke OpenWorker Embedded Control

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/2026-08-19-1846-OpenWorker-Embedded-Control-密语Runner-Hook-v1.md'
      - 'scripts/openworker-job-started-hook.ps1'
      - 'scripts/openworker-job-started.cmd'
      - 'scripts/install-openworker-runner-hook.ps1'
      - '.github/workflows/smoke-openworker-embedded-control.yml'

permissions:
  contents: read

jobs:
  no-secret-passthrough:
    name: Hook passthrough without secret
    runs-on: [self-hosted, Windows, X64, ODA]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Ordinary workflow body
        shell: powershell
        run: |
          Write-Host 'ordinary workflow executed'

  recognized-secret:
    name: Hook recognizes OpenWorker secret
    runs-on: [self-hosted, Windows, X64, ODA]
    timeout-minutes: 2
    env:
      OPENWORKER_CONTROL: >-
        {"schema":"openworker.control-envelope.v1","request_id":"case0005-hook-smoke-001","command":"CASE.STATUS","machine":"DESKTOP-ODAQN0D","case_id":"0005","policy":{"max_parallel":4,"join":"case-defined","fail_closed":true}}
    steps:
      - uses: actions/checkout@v4
      - name: Body reached after hook
        shell: powershell
        run: |
          Write-Host 'recognized-secret workflow body reached'
