name: Case 0005 Local Controller Kick ODA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: case0005-local-controller-kick-oda
  cancel-in-progress: false

jobs:
  kick-local-controller:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[case0005-local-kick]')
    runs-on: [self-hosted, Windows, X64, ODA]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Submit Case 0005 to resident ODA OpenWorker
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/case0005_resident_bootstrap.ps1 2>&1 | Tee-Object -FilePath case0005-resident-bootstrap.log

      - name: Snapshot durable local state
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $base='http://127.0.0.1:8787'
          $workspace='D:\AI-Work\jobs\0005-SNOW-WHITE'
          $node=$null; $jobs=@(); $errors=@()
          try{$node=Invoke-RestMethod "$base/v1/node/status"}catch{$errors+=$_.Exception.Message}
          try{
            $raw=Invoke-RestMethod "$base/v1/jobs?limit=1000"
            $items=@(); if($raw.jobs){$items=@($raw.jobs)} elseif($raw -is [System.Array]){$items=@($raw)}
            $jobs=@($items | Where-Object {$_.job_id -like 'case0005-*'} | Sort-Object created_at -Descending | Select-Object -First 50)
          }catch{$errors+=$_.Exception.Message}
          $receipt=[ordered]@{
            schema='openworker/case0005-local-controller-kick/v2';case_id='0005';machine=$env:COMPUTERNAME;
            workspace_root=$workspace;observed_at=[DateTimeOffset]::UtcNow.ToString('o');
            github_action_role='transport_only';business_execution_authority='resident_openworker_local_supervisor';
            node=$node;case_jobs=$jobs;errors=$errors
          }
          New-Item -ItemType Directory -Force -Path 'case-evidence/0005' | Out-Null
          $receipt | ConvertTo-Json -Depth 20 | Set-Content 'case-evidence/0005/local-controller-kick.json' -Encoding utf8
          $local=Join-Path $workspace 'evidence\case0005-resident-bootstrap.json'
          if(Test-Path -LiteralPath $local){Copy-Item -LiteralPath $local -Destination 'case-evidence/0005/resident-bootstrap.json' -Force}
          git config user.name 'openworker-evidence-bot'
          git config user.email 'openworker-evidence-bot@users.noreply.github.com'
          git add -- case-evidence/0005
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m 'evidence(case0005): record resident ODA bootstrap';git pull --rebase origin main;git push origin HEAD:main}
