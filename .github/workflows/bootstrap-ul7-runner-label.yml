name: Drain OpenWorker Queue Through Go Tool

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-ul7-runner-label.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: openworker-queue-drain
  cancel-in-progress: true

jobs:
  drain:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Drain every other OpenWorker Action run through gtr-actions-queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $goToolRoot='D:\AI-Tools\AI Tool Runtime'
          if(-not (Test-Path -LiteralPath (Join-Path $goToolRoot 'cmd\gtr-actions-queue\main.go') -PathType Leaf)){
            throw "go-tool-runtime queue CLI unavailable: $goToolRoot"
          }
          $cfg=Join-Path $env:RUNNER_TEMP 'openworker-queue-admin.yaml'
          @'
          actions:
            enabled: true
            api_base: https://api.github.com
            auth_mode: auto
            token_env: GITHUB_TOKEN
            capabilities:
              - id: openworker.queue.admin
                description: Administrative queue scope for OpenWorker only.
                repository: liuxb99/openworker
                workflow: case-0003-drive-api-publish-ul7.yml
                ref: main
                inputs: {}
                artifacts: []
                runner_labels: [self-hosted, Windows, X64]
          '@ | Set-Content -LiteralPath $cfg -Encoding utf8

          Push-Location $goToolRoot
          try {
            $report = & go run ./cmd/gtr-actions-queue --config $cfg --capability openworker.queue.admin --cancel-active --workflow-scoped=false --exclude-run-id $env:GITHUB_RUN_ID --verify-seconds 15
            if($LASTEXITCODE -ne 0){ throw "gtr-actions-queue drain failed exit=$LASTEXITCODE`n$report" }
            $report | Write-Host
            $parsed = ($report -join "`n") | ConvertFrom-Json
            if(-not $parsed.clean){ throw 'OpenWorker queue is not clean after drain' }

            $verify = & go run ./cmd/gtr-actions-queue --config $cfg --capability openworker.queue.admin --workflow-scoped=false --exclude-run-id $env:GITHUB_RUN_ID
            if($LASTEXITCODE -ne 0){ throw "gtr-actions-queue verify failed exit=$LASTEXITCODE`n$verify" }
            $verify | Write-Host
            $v = ($verify -join "`n") | ConvertFrom-Json
            if(-not $v.clean -or @($v.active).Count -ne 0){ throw 'OpenWorker queue verification is not empty' }
            Write-Host "OPENWORKER_QUEUE_DRAIN_PASS current_run=$env:GITHUB_RUN_ID machine=$env:COMPUTERNAME"
          }
          finally {
            Pop-Location
          }
