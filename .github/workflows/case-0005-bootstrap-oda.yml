name: Case 0005 Bootstrap ODA

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap-requests/case-0005-oda.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: [self-hosted, Windows, X64, ODA]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify ODA
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ine 'DESKTOP-ODAQN0D') { throw "wrong host: $env:COMPUTERNAME" }
      - name: One-shot local OpenWorker bootstrap only
        shell: powershell
        run: |
          & .\scripts\case0005_resident_bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { throw "case0005 resident bootstrap failed: $LASTEXITCODE" }
      - name: Verify bootstrap receipt exists
        shell: powershell
        run: |
          $p='D:\AI-Work\jobs\0005-SNOW-WHITE\evidence\case0005-resident-bootstrap.json'
          if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "missing bootstrap receipt $p" }
          $r=Get-Content -Raw -LiteralPath $p | ConvertFrom-Json
          if ($r.case_id -ne '0005' -or $r.machine -ine 'DESKTOP-ODAQN0D') { throw 'invalid bootstrap receipt' }
          if (-not $r.ack.job.accepted) { throw 'bootstrap not durably accepted' }
          Write-Host "CASE0005_LOCAL_BOOTSTRAP_ACCEPTED workspace=$($r.workspace_root)"
      - name: Publish bootstrap ACK only
        shell: powershell
        run: |
          $src='D:\AI-Work\jobs\0005-SNOW-WHITE\evidence\case0005-resident-bootstrap.json'
          $r=Get-Content -Raw -LiteralPath $src | ConvertFrom-Json
          $out=[ordered]@{
            schema='openworker/case0005-bootstrap-ack/v1'
            case_id='0005'
            machine='DESKTOP-ODAQN0D'
            workspace_root=[string]$r.workspace_root
            accepted=[bool]$r.ack.job.accepted
            work_id=[string]$r.ack.job.id
            authority=[string]$r.ack.authority
            github_action_used_for_business_execution=$false
            run_id=$env:GITHUB_RUN_ID
            observed_at=[DateTimeOffset]::UtcNow.ToString('o')
          }
          $dest='evidence/case0005/latest-bootstrap-ack.json'
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          $out | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $dest -Encoding utf8
          git config user.name 'openworker-bootstrap-bot'
          git config user.email 'openworker-bootstrap-bot@users.noreply.github.com'
          git add $dest
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m "case0005: record ODA local bootstrap ack"
            git push origin HEAD:main
            if($LASTEXITCODE -ne 0){ throw 'failed to publish bootstrap ack receipt' }
          }
