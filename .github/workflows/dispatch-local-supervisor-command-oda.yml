name: Dispatch Local Supervisor Command ODA

on:
  workflow_dispatch:
    inputs:
      command:
        description: Fixed high-level local supervisor command
        required: true
        type: choice
        options:
          - supervisor_status
          - case_status
          - case_continue
          - queue_clear
  push:
    branches: [main]
    paths:
      - 'command-requests/oda.json'

permissions:
  contents: write

concurrency:
  group: openworker-command-transport-oda
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: [self-hosted, Windows, X64, ODA]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve fixed transport request
        id: request
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMMAND: ${{ inputs.command }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine 'DESKTOP-ODAQN0D'){
            throw "wrong host $env:COMPUTERNAME"
          }

          if($env:EVENT_NAME -eq 'workflow_dispatch'){
            $command=$env:INPUT_COMMAND
            $requestId="manual-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          }elseif($env:EVENT_NAME -eq 'push'){
            $path=Join-Path $env:GITHUB_WORKSPACE 'command-requests\oda.json'
            if(-not(Test-Path -LiteralPath $path -PathType Leaf)){throw "request missing: $path"}
            try{$req=Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -ErrorAction Stop}catch{throw "invalid request JSON: $_"}
            if($req.schema -ne 'openworker.command-request.v1'){throw "unsupported request schema=$($req.schema)"}
            if($req.machine -ine 'DESKTOP-ODAQN0D'){throw "unsupported request machine=$($req.machine)"}
            if($req.case_id -ne '0005'){throw "unsupported request case_id=$($req.case_id)"}
            if($req.requested_by -ne 'chatgpt'){throw "unsupported requested_by=$($req.requested_by)"}
            if(-not $req.request_id -or [string]$req.request_id -notmatch '^[A-Za-z0-9._-]{8,128}$'){throw 'invalid request_id'}
            $command=[string]$req.command
            $requestId=[string]$req.request_id
          }else{
            throw "unsupported event=$env:EVENT_NAME"
          }

          $allowed=@('supervisor_status','case_status','case_continue','queue_clear')
          if($allowed -notcontains $command){throw "unsupported command=$command"}
          "command=$command" >> $env:GITHUB_OUTPUT
          "request_id=$requestId" >> $env:GITHUB_OUTPUT

      - name: Submit to localhost local supervisor and publish transport receipt
        id: dispatch
        shell: powershell
        env:
          COMMAND: ${{ steps.request.outputs.command }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          $ErrorActionPreference='Stop'
          $raw=& "$env:GITHUB_WORKSPACE\scripts\invoke-local-supervisor-command-transport.ps1" -Command $env:COMMAND -RequestId $env:REQUEST_ID -ExpectedMachine 'DESKTOP-ODAQN0D' | Out-String
          if($LASTEXITCODE -ne 0){throw "transport wrapper failed before receipt exit=$LASTEXITCODE output=$raw"}
          try{$receipt=$raw|ConvertFrom-Json -ErrorAction Stop}catch{throw "non-JSON transport receipt: $raw"}
          if($receipt.schema -ne 'openworker.command-transport.v1'){throw "unexpected receipt schema=$($receipt.schema)"}
          if(-not $receipt.github_action_used_for_command_transport){throw 'command transport flag missing'}
          if($receipt.github_action_used_for_business_execution){throw 'business execution escaped into GitHub Action'}

          $result=[ordered]@{
            schema='openworker.command-result.v1'
            request_id=$env:REQUEST_ID
            command=$env:COMMAND
            machine='DESKTOP-ODAQN0D'
            case_id=if($env:COMMAND -in @('case_status','case_continue')){'0005'}else{$null}
            transport='github_actions_transient_dispatch'
            accepted=[bool]$receipt.accepted
            transport_ok=[bool]$receipt.accepted
            exit_code=$receipt.exit_code
            error=$receipt.error
            github_run_id=$env:GITHUB_RUN_ID
            github_run_attempt=$env:GITHUB_RUN_ATTEMPT
            github_action_used_for_command_transport=$true
            github_action_used_for_business_execution=$false
            business_completion_claimed=$false
            authoritative_business_state='openworker'
            completed_at=[DateTimeOffset]::UtcNow.ToString('o')
            receipt=$receipt
          }

          $resultJson=$result|ConvertTo-Json -Depth 40
          Write-Host ($result|ConvertTo-Json -Depth 40 -Compress)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### OpenWorker transient command transport'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```json'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $resultJson
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```'

          $resultDir=Join-Path $env:GITHUB_WORKSPACE 'command-results'
          New-Item -ItemType Directory -Force -Path $resultDir|Out-Null
          $resultPath=Join-Path $resultDir 'oda.json'
          [IO.File]::WriteAllText($resultPath,$resultJson+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))

          git config user.name 'openworker-command-transport'
          git config user.email 'openworker-command-transport@users.noreply.github.com'
          git add -- 'command-results/oda.json'
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m "receipt: ODA $env:COMMAND $env:REQUEST_ID"
            if($LASTEXITCODE -ne 0){throw 'failed to commit transport receipt'}
            $pushed=$false
            for($i=0;$i -lt 3;$i++){
              git pull --rebase origin main
              if($LASTEXITCODE -ne 0){throw 'failed to rebase transport receipt'}
              git push origin HEAD:main
              if($LASTEXITCODE -eq 0){$pushed=$true;break}
              Start-Sleep -Seconds 2
            }
            if(-not $pushed){throw 'failed to push transport receipt'}
          }

      - name: Assert transport-only boundary and surface rejection after receipt publish
        shell: powershell
        run: |
          $result=Get-Content -LiteralPath 'command-results\oda.json' -Raw | ConvertFrom-Json
          if($result.github_action_used_for_business_execution){throw 'business execution escaped into GitHub Action'}
          Write-Host 'TRANSPORT_ONLY_VERIFIED github_action_used_for_business_execution=false'
          if(-not $result.accepted){
            throw "LOCAL_TRANSPORT_REJECTED request_id=$($result.request_id) exit_code=$($result.exit_code) error=$($result.error)"
          }
