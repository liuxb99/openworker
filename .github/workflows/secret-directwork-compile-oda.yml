name: Secret DirectWork Compile ODA

on:
  push:
    branches: [main]
    paths:
      - 'secret-requests/directwork-compile-oda.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: [self-hosted, Windows, X64, ODA]
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send DIRECTWORK.COMPILE secret to OpenWorker authority
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine 'DESKTOP-ODAQN0D'){
            throw "wrong host $env:COMPUTERNAME expected=DESKTOP-ODAQN0D"
          }

          $requestPath=Join-Path $env:GITHUB_WORKSPACE 'secret-requests\directwork-compile-oda.json'
          if(Test-Path -LiteralPath $requestPath -PathType Leaf){
            $req=Get-Content -LiteralPath $requestPath -Raw | ConvertFrom-Json -ErrorAction Stop
          }else{
            $req=[pscustomobject]@{schema='openworker.secret-command.v1';phrase='DIRECTWORK.COMPILE';request_id=("manual-"+$env:GITHUB_RUN_ID)}
          }
          if([string]$req.schema -ne 'openworker.secret-command.v1'){throw "bad schema=$($req.schema)"}
          if([string]$req.phrase -ne 'DIRECTWORK.COMPILE'){throw "bad phrase=$($req.phrase)"}
          $requestId=[string]$req.request_id
          if($requestId -notmatch '^[A-Za-z0-9._-]{8,96}$'){throw "bad request_id=$requestId"}

          $source=Join-Path $env:GITHUB_WORKSPACE 'migration\directwork-src'
          if(-not(Test-Path -LiteralPath (Join-Path $source 'go.mod') -PathType Leaf)){throw "vendored DirectWork source missing: $source"}
          $sourceCommit=(Get-Content -LiteralPath (Join-Path $source 'SOURCE_COMMIT.txt') -Raw).Trim()

          $workRoot=Join-Path $env:ProgramData ("OpenWorker\secret-work\"+$requestId)
          $src=Join-Path $workRoot 'src'
          $artifactDir=Join-Path $workRoot 'artifacts'
          if(Test-Path -LiteralPath $workRoot){Remove-Item -LiteralPath $workRoot -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $src,$artifactDir | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $src -Recurse -Force

          $compileScript=Join-Path $workRoot 'compile.ps1'
          @'
          param([Parameter(Mandatory=$true)][string]$Source,[Parameter(Mandatory=$true)][string]$Out)
          $ErrorActionPreference='Stop'
          Set-Location -LiteralPath $Source
          Write-Host 'SECRET=DIRECTWORK.COMPILE'
          Write-Host ("SOURCE="+$Source)
          & go version
          if($LASTEXITCODE -ne 0){exit 10}
          & go mod download
          if($LASTEXITCODE -ne 0){exit 20}
          & go test ./... -count=1
          if($LASTEXITCODE -ne 0){exit 30}
          & go build -buildvcs=false -o $Out ./cmd/directwork-node
          if($LASTEXITCODE -ne 0){exit 40}
          $f=Get-Item -LiteralPath $Out
          $h=(Get-FileHash -LiteralPath $Out -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host ("ARTIFACT="+$f.FullName)
          Write-Host ("SIZE="+$f.Length)
          Write-Host ("SHA256="+$h)
          exit 0
          '@ | Set-Content -LiteralPath $compileScript -Encoding UTF8

          $jobId=("secret-directwork-compile-"+$requestId).ToLowerInvariant()
          $cmd='powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "'+$compileScript+'" -Source "'+$src+'" -Out "'+(Join-Path $artifactDir 'directwork-node.exe')+'"'
          $body=[ordered]@{
            job_id=$jobId
            dispatch_id=$requestId
            machine='DESKTOP-ODAQN0D'
            priority=100
            command=$cmd
            cwd=$workRoot
            workspace_root=$workRoot
            timeout_sec=1800
            locks=@('directwork.compile')
          }

          $ack=Invoke-RestMethod -Method POST -Uri 'http://127.0.0.1:8787/v1/jobs' -ContentType 'application/json' -Body ($body|ConvertTo-Json -Depth 20) -TimeoutSec 10
          if($ack.accepted -ne $true){throw 'OpenWorker did not accept durable compile job'}

          $terminal=@('succeeded','failed','timed_out','cancelled','stale')
          $job=$null
          for($i=0;$i -lt 1800;$i++){
            $job=Invoke-RestMethod -Method GET -Uri ('http://127.0.0.1:8787/v1/jobs/'+[uri]::EscapeDataString($jobId)) -TimeoutSec 10
            if($terminal -contains [string]$job.status){break}
            Start-Sleep -Seconds 1
          }
          if($null-eq$job){throw 'durable compile job not readable'}
          $events=Invoke-RestMethod -Method GET -Uri ('http://127.0.0.1:8787/v1/jobs/'+[uri]::EscapeDataString($jobId)+'/events?limit=200') -TimeoutSec 10
          try{$artifacts=Invoke-RestMethod -Method GET -Uri ('http://127.0.0.1:8787/v1/jobs/'+[uri]::EscapeDataString($jobId)+'/artifacts') -TimeoutSec 10}catch{$artifacts=[ordered]@{error=$_.Exception.Message}}

          $stdout='';$stderr=''
          if($job.stdout_path -and (Test-Path -LiteralPath $job.stdout_path)){ $stdout=(Get-Content -LiteralPath $job.stdout_path -Raw -ErrorAction SilentlyContinue); if($stdout.Length -gt 120000){$stdout=$stdout.Substring($stdout.Length-120000)} }
          if($job.stderr_path -and (Test-Path -LiteralPath $job.stderr_path)){ $stderr=(Get-Content -LiteralPath $job.stderr_path -Raw -ErrorAction SilentlyContinue); if($stderr.Length -gt 120000){$stderr=$stderr.Substring($stderr.Length-120000)} }

          $artifactPath=Join-Path $artifactDir 'directwork-node.exe'
          $artifact=$null
          if(Test-Path -LiteralPath $artifactPath -PathType Leaf){
            $f=Get-Item -LiteralPath $artifactPath
            $artifact=[ordered]@{path=$f.FullName;size=$f.Length;sha256=(Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()}
          }

          $receipt=[ordered]@{
            schema='openworker.secret-compile-receipt.v1'
            phrase='DIRECTWORK.COMPILE'
            request_id=$requestId
            source_commit=$sourceCommit
            authority='openworker-local-supervisor'
            transport='github_actions'
            github_action_used_for_command_transport=$true
            github_action_used_for_business_execution=$false
            ack=$ack
            durable_job=$job
            durable_events=$events
            artifacts_api=$artifacts
            artifact=$artifact
            stdout=$stdout
            stderr=$stderr
            github_run_id=$env:GITHUB_RUN_ID
            observed_at=[DateTimeOffset]::UtcNow.ToString('o')
          }

          $rel="secret-results/directwork-compile/$requestId.json"
          $receiptPath=Join-Path $env:GITHUB_WORKSPACE ($rel -replace '/','\')
          New-Item -ItemType Directory -Force -Path (Split-Path $receiptPath) | Out-Null
          [IO.File]::WriteAllText($receiptPath,($receipt|ConvertTo-Json -Depth 80)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))

          git config user.name 'openworker-secret-compile'
          git config user.email 'openworker-secret-compile@users.noreply.github.com'
          git add -- $rel
          git commit -m ("receipt: DIRECTWORK.COMPILE "+$requestId)
          if($LASTEXITCODE -ne 0){throw 'failed to commit compile receipt'}
          $pushed=$false
          for($n=0;$n -lt 4;$n++){
            git pull --rebase origin main
            if($LASTEXITCODE -ne 0){git rebase --abort 2>$null;Start-Sleep -Seconds 1;continue}
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){$pushed=$true;break}
            Start-Sleep -Seconds 2
          }
          if(-not $pushed){throw 'failed to push compile receipt'}
          if([string]$job.status -ne 'succeeded'){throw "DIRECTWORK.COMPILE failed durable_status=$($job.status) exit=$($job.exit_code)"}
