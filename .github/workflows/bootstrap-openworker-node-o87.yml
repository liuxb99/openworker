name: Bootstrap OpenWorker Node Service O87

on:
  workflow_dispatch:
    inputs:
      listen:
        description: Local bind address
        required: false
        default: '127.0.0.1:8787'
        type: string
      advertise:
        description: Reachable URL other nodes should use
        required: false
        type: string
      peers:
        description: Comma-separated reachable OpenWorker node URLs
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bootstrap-o87-node]') || contains(github.event.head_commit.message, '[upgrade-openworker-nodes]')
    runs-on: [self-hosted, Windows, X64, O87]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed O87 computer
        shell: powershell
        run: if($env:COMPUTERNAME -ine 'DESKTOP-O87PJNR'){throw "wrong host $env:COMPUTERNAME"}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go-runtime/go.sum
      - name: Build native Windows service binary
        shell: powershell
        working-directory: go-runtime
        run: |
          go mod tidy
          $commit=$env:GITHUB_SHA
          $build=[DateTime]::UtcNow.ToString('o')
          go build -ldflags "-X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.Version=p2-node -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.Commit=$commit -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.TargetCommit=$commit -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.BuildTime=$build" -o openworker-node.exe ./cmd/openworker-node
      - name: Install or upgrade OpenWorkerNode service
        shell: powershell
        env:
          LISTEN: ${{ inputs.listen || '127.0.0.1:8787' }}
          ADVERTISE: ${{ inputs.advertise }}
          PEERS: ${{ inputs.peers }}
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\install_openworker_node_service.ps1" -SourceExe "$env:GITHUB_WORKSPACE\go-runtime\openworker-node.exe" -Workers 4 -Capabilities 'case0004,dwg,story-index,engineering' -Listen $env:LISTEN -Advertise $env:ADVERTISE -Peers $env:PEERS
      - name: Verify installed service and authoritative upgrade status
        shell: powershell
        run: |
          $svc=Get-Service OpenWorkerNode
          if($svc.Status -ne 'Running'){throw "service status=$($svc.Status)"}
          $s=Invoke-RestMethod 'http://127.0.0.1:8787/v1/node/status'
          if($s.machine -ine 'DESKTOP-O87PJNR'){throw "node machine=$($s.machine)"}
          if($s.build.commit -ne $env:GITHUB_SHA){throw "node commit=$($s.build.commit) expected=$env:GITHUB_SHA"}
          if($s.service.running_commit -ne $env:GITHUB_SHA){throw "running_commit=$($s.service.running_commit) expected=$env:GITHUB_SHA"}
          if($s.service.target_commit -ne $env:GITHUB_SHA){throw "target_commit=$($s.service.target_commit) expected=$env:GITHUB_SHA"}
          if(-not $s.service.upgrade_verified){throw "upgrade not verified status=$($s.service.upgrade_status)"}
          if($s.service.upgrade_status -ne 'VERIFIED'){throw "upgrade_status=$($s.service.upgrade_status)"}
          if(-not $s.lease_until){throw 'missing lease_until'}
          if(-not ($s.inventory.capabilities -contains 'dwg')){throw 'missing dwg capability'}
          if(-not $s.advertise_endpoint){throw 'missing advertise endpoint'}
          $s|ConvertTo-Json -Depth 20
