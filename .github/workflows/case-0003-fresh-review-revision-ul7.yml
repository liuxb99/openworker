name: Case 0003 Fresh Review Revision UL7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case-0003-fresh-review-revision-ul7.yml'

permissions:
  contents: read

concurrency:
  group: case-0003-fresh-review-revision-ul7
  cancel-in-progress: false

env:
  CASE0003_ASSIGNED_HOST: DESKTOP-UL7V2VV
  CASE0003_WORKSPACE: 'D:\AI-Work\jobs\0003-YUJING-BRIDGE'
  CASE0003_EXPECTED_SCENEX_SHA: f193a008d143c6b210f2051d3f1dc16304eb282ce5e62cdad7ed670f19845a3d
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  prepare:
    runs-on: [self-hosted, Windows, X64, UL7]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Verify fixed UL7 and exact repaired SceneX output
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine $env:CASE0003_ASSIGNED_HOST){throw ('wrong host '+$env:COMPUTERNAME)}
          $png=Join-Path $env:CASE0003_WORKSPACE 'scenex\terrain-browse.png'
          if(-not(Test-Path -LiteralPath $png -PathType Leaf)){throw 'repaired SceneX PNG missing'}
          $sha=(Get-FileHash -LiteralPath $png -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne $env:CASE0003_EXPECTED_SCENEX_SHA){throw ('SceneX output drift '+$sha)}
          Write-Host "CASE0003_FRESH_REVIEW_INPUT_PASS scenex_sha256=$sha"

      - name: Checkout OpenWorker main
        uses: actions/checkout@v4
        with:
          ref: main
          path: openworker

      - name: Build fresh mechanical acceptance and immutable review revision
        env:
          PYTHONPATH: ${{ github.workspace }}\openworker
        run: |
          $ErrorActionPreference='Stop'
          python openworker\scripts\case0003_review_handoff.py --workspace $env:CASE0003_WORKSPACE
          $code=$LASTEXITCODE
          if($code -ne 0 -and $code -ne 3){throw ('fresh review handoff failed exit='+$code)}
          $state=Join-Path $env:CASE0003_WORKSPACE 'acceptance\openworker-final\work-ledger-final-acceptance.json'
          $ev=Get-Content -LiteralPath $state -Raw|ConvertFrom-Json
          if([string]$ev.status -ne 'WAITING_DRIVE_HANDOFF' -and [string]$ev.status -ne 'WAITING_LLM_REVIEW' -and [string]$ev.status -ne 'MECHANICAL_PASS_PREPARING_LLM_REVIEW'){throw ('fresh review state unexpected '+[string]$ev.status)}
          $revision=[string]$ev.revision_id
          if([string]::IsNullOrWhiteSpace($revision)){throw 'fresh revision id missing'}
          $bundle=Join-Path $env:CASE0003_WORKSPACE ('.openworker\reviews\'+$revision)
          foreach($name in @('manifest.json','manifest.sha256','review-request.json','artifacts\scenex-browse.png','artifacts\blender-render.png','artifacts\delivery-index.html')){
            if(-not(Test-Path -LiteralPath (Join-Path $bundle $name) -PathType Leaf)){throw ('fresh review bundle missing '+$name)}
          }
          $manifestSha=(Get-Content -LiteralPath (Join-Path $bundle 'manifest.sha256') -Raw).Trim().ToLowerInvariant()
          $scenexSha=(Get-FileHash -LiteralPath (Join-Path $bundle 'artifacts\scenex-browse.png') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($scenexSha -ne $env:CASE0003_EXPECTED_SCENEX_SHA){throw ('fresh bundle SceneX drift '+$scenexSha)}
          $blenderSha=(Get-FileHash -LiteralPath (Join-Path $bundle 'artifacts\blender-render.png') -Algorithm SHA256).Hash.ToLowerInvariant()
          $deliverySha=(Get-FileHash -LiteralPath (Join-Path $bundle 'artifacts\delivery-index.html') -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "CASE0003_FRESH_REVIEW_READY revision=$revision status=$($ev.status) manifest_sha256=$manifestSha scenex_sha256=$scenexSha blender_sha256=$blenderSha delivery_sha256=$deliverySha bundle=$bundle"
