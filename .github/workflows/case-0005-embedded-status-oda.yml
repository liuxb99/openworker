name: Case0005 Embedded Control Status ODA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  case-status:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[case0005-embedded-status]')
    runs-on: [self-hosted, Windows, X64, ODA]
    timeout-minutes: 3
    env:
      OPENWORKER_CONTROL: >-
        {"schema":"openworker.control-envelope.v1","request_id":"case0005-status-20260819-a1","command":"CASE.STATUS","machine":"DESKTOP-ODAQN0D","case_id":"0005","policy":{"max_parallel":4,"join":"wait_all","fail_closed":true}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify transport-only boundary
        shell: powershell
        run: |
          if($env:COMPUTERNAME -ine 'DESKTOP-ODAQN0D'){throw "wrong host $env:COMPUTERNAME"}
          Write-Host 'Embedded Control hook has already run at ACTIONS_RUNNER_HOOK_JOB_STARTED.'
          Write-Host 'GitHub Action performs read-back only; no Case business execution here.'
      - name: Read back durable control receipts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $requestId='case0005-status-20260819-a1'
          $hook=Join-Path $env:ProgramData "OpenWorker\hooks\receipts\$requestId.json"
          $dispatch=Join-Path $env:ProgramData "OpenWorker\control-envelope\receipts\$requestId.json"
          if(-not(Test-Path -LiteralPath $hook -PathType Leaf)){throw "hook receipt missing: $hook"}
          if(-not(Test-Path -LiteralPath $dispatch -PathType Leaf)){throw "dispatcher receipt missing: $dispatch"}
          $hookObj=Get-Content -LiteralPath $hook -Raw|ConvertFrom-Json
          $dispatchObj=Get-Content -LiteralPath $dispatch -Raw|ConvertFrom-Json
          if(-not $hookObj.accepted){throw "hook rejected control: $($hookObj|ConvertTo-Json -Compress -Depth 30)"}
          if(-not $dispatchObj.accepted){throw "dispatcher rejected control: $($dispatchObj|ConvertTo-Json -Compress -Depth 30)"}
          $out=[ordered]@{
            schema='openworker.case0005-control-readback/v1'
            case_id='0005'
            machine=$env:COMPUTERNAME
            request_id=$requestId
            command='CASE.STATUS'
            hook=$hookObj
            dispatcher=$dispatchObj
            github_run_id=$env:GITHUB_RUN_ID
            github_action_used_for_command_transport=$true
            github_action_used_for_business_execution=$false
            observed_at=[DateTimeOffset]::UtcNow.ToString('o')
          }
          $rel="command-results/DESKTOP-ODAQN0D/$requestId/final.json"
          $path=Join-Path $env:GITHUB_WORKSPACE ($rel -replace '/','\')
          New-Item -ItemType Directory -Force -Path (Split-Path $path)|Out-Null
          [IO.File]::WriteAllText($path,($out|ConvertTo-Json -Depth 50)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          git config user.name 'openworker-control-readback'
          git config user.email 'openworker-control-readback@users.noreply.github.com'
          git add -- $rel
          git commit -m "receipt(case0005): embedded CASE.STATUS $requestId"
          if($LASTEXITCODE -ne 0){throw 'failed to commit embedded-control readback'}
          git pull --rebase origin main
          if($LASTEXITCODE -ne 0){throw 'failed to rebase embedded-control readback'}
          git push origin HEAD:main
          if($LASTEXITCODE -ne 0){throw 'failed to push embedded-control readback'}
