name: OpenWorker Control PR

on:
  pull_request:
    types: [opened]

permissions:
  actions: write
  pull-requests: write
  contents: read

concurrency:
  group: openworker-control-pr
  cancel-in-progress: false

jobs:
  control:
    if: startsWith(github.event.pull_request.title, '[openworker-control]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execute allowlisted OpenWorker control command
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          command=$(printf '%s\n' "$BODY" | sed -nE 's/^[[:space:]]*command:[[:space:]]*([A-Za-z0-9_-]+)[[:space:]]*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]')
          case "$command" in
            drain|upgrade) ;;
            *) echo "unsupported or missing command: $command" >&2; exit 2 ;;
          esac
          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          if [ "$command" = 'drain' ]; then
            runs=$(curl -fsSL "${auth[@]}" "${api}/actions/runs?per_page=100")
            ids=$(printf '%s' "$runs" | jq -r --arg current "$GITHUB_RUN_ID" '.workflow_runs[] | select((.id|tostring) != $current and (.status == "queued" or .status == "in_progress")) | .id')
            count=0
            while read -r id; do
              [ -z "$id" ] && continue
              code=$(curl -sS -o /tmp/cancel-response -w '%{http_code}' -X POST "${auth[@]}" "${api}/actions/runs/${id}/cancel")
              if [ "$code" != '202' ] && [ "$code" != '409' ]; then cat /tmp/cancel-response || true; exit 1; fi
              count=$((count+1))
            done <<< "$ids"
            result="cancelled active runs: ${count}"
          else
            before=$(curl -fsSL "${auth[@]}" "${api}/actions/workflows/upgrade-openworker-nodes-v3.yml/runs?event=workflow_dispatch&per_page=1")
            before_id=$(printf '%s' "$before" | jq -r '.workflow_runs[0].id // 0')
            code=$(curl -sS -o /tmp/dispatch-response -w '%{http_code}' -X POST "${auth[@]}" "${api}/actions/workflows/upgrade-openworker-nodes-v3.yml/dispatches" -d '{"ref":"main"}')
            if [ "$code" != '204' ]; then cat /tmp/dispatch-response || true; echo "upgrade v3 dispatch failed http=${code}" >&2; exit 1; fi

            v3=''
            for i in $(seq 1 12); do
              sleep 2
              runs=$(curl -fsSL "${auth[@]}" "${api}/actions/workflows/upgrade-openworker-nodes-v3.yml/runs?event=workflow_dispatch&per_page=5")
              v3=$(printf '%s' "$runs" | jq -c --argjson before "$before_id" '[.workflow_runs[] | select(.id != $before)] | sort_by(.created_at) | reverse | .[0] // empty')
              [ -n "$v3" ] && break
            done
            if [ -z "$v3" ]; then
              result='upgrade-openworker-nodes-v3.yml dispatch accepted, but no new run became visible within control polling window'
            else
              run_id=$(printf '%s' "$v3" | jq -r '.id')
              status=$(printf '%s' "$v3" | jq -r '.status')
              conclusion=$(printf '%s' "$v3" | jq -r '.conclusion // ""')
              created=$(printf '%s' "$v3" | jq -r '.created_at')
              result="upgrade-openworker-nodes-v3.yml run_id=${run_id} status=${status} conclusion=${conclusion} created_at=${created}; routing=generic self-hosted Windows; machine identity checked by COMPUTERNAME"
            fi
          fi

          body=$(jq -nc --arg c "$command" --arg r "$GITHUB_RUN_ID" --arg result "$result" '{body:("OpenWorker control accepted: `"+$c+"`. Source run: `"+$r+"`.\n\n"+$result)}')
          curl -fsSL -X POST "${auth[@]}" -H 'Content-Type: application/json' "${api}/issues/${PR}/comments" -d "$body" >/dev/null
          echo "OPENWORKER_CONTROL_PASS command=${command}"
