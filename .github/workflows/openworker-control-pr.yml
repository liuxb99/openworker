name: OpenWorker Control PR

on:
  pull_request:
    types: [opened]

permissions:
  actions: write
  pull-requests: write
  contents: read

concurrency:
  group: openworker-control-pr
  cancel-in-progress: false

jobs:
  control:
    if: startsWith(github.event.pull_request.title, '[openworker-control]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Parse allowlisted command
        id: parse
        shell: bash
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          command=$(printf '%s\n' "$BODY" | sed -nE 's/^[[:space:]]*command:[[:space:]]*([A-Za-z0-9_-]+)[[:space:]]*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]')
          case "$command" in
            drain|reconcile|upgrade) ;;
            *) echo "unsupported or missing command: $command" >&2; exit 2 ;;
          esac
          echo "command=$command" >> "$GITHUB_OUTPUT"

      - name: Dispatch allowlisted OpenWorker workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMAND: ${{ steps.parse.outputs.command }}
        run: |
          set -euo pipefail
          case "$COMMAND" in
            drain) workflow='bootstrap-ul7-runner-label.yml' ;;
            reconcile) workflow='bootstrap-three-node-labels-v2.yml' ;;
            upgrade) workflow='upgrade-openworker-nodes-v2.yml' ;;
          esac
          api="https://api.github.com/repos/${REPO}/actions/workflows/${workflow}/dispatches"
          code=$(curl -sS -o /tmp/dispatch-response -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" \
            -d '{"ref":"main"}')
          if [ "$code" != '204' ]; then
            cat /tmp/dispatch-response || true
            echo "workflow dispatch failed command=${COMMAND} workflow=${workflow} http=${code}" >&2
            exit 1
          fi
          echo "OPENWORKER_CONTROL_DISPATCH_PASS command=${COMMAND} workflow=${workflow}"

      - name: Comment control acknowledgement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          COMMAND: ${{ steps.parse.outputs.command }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/issues/${PR}/comments" \
            -d "$(jq -nc --arg c "$COMMAND" --arg r "$GITHUB_RUN_ID" '{body:("OpenWorker control accepted: `"+$c+"`. Dispatch source run: `"+$r+"`.")}')" >/dev/null
