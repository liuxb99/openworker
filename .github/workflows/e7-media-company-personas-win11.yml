name: E7 Media Company Personas Win11

on:
  push:
    branches:
      - engineering-h11-workspace-bootstrap
    paths:
      - 'coworker/personas/builtin/media.md'
      - 'coworker/personas/builtin/company.md'
      - 'coworker/personas/**'
      - 'tests/test_e7_builtin_personas.py'
      - 'tests/test_e7_task_packages.py'
      - 'tests/test_e7_product_contract.py'
      - 'tests/test_e7_submission.py'
      - '.github/workflows/e7-media-company-personas-win11.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openworker-e7-media-company-personas-win11
  cancel-in-progress: true

jobs:
  e7-personas:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    steps:
      - name: Runner identity
        run: |
          echo machine=%COMPUTERNAME%
          python --version
          git --version

      - uses: actions/checkout@v4

      - name: Install OpenWorker
        run: python -m pip install -e ".[dev]"

      - name: Compile E7 persona runtime
        run: python -m compileall -q coworker\personas tests\test_e7_builtin_personas.py tests\test_e7_task_packages.py tests\test_e7_product_contract.py tests\test_e7_submission.py

      - name: E7 persona product contracts
        run: python -m pytest tests\test_e7_builtin_personas.py tests\test_e7_task_packages.py tests\test_e7_product_contract.py tests\test_e7_submission.py -q

      - name: Registry and submission-contract smoke
        run: python -c "from coworker.personas.registry import PersonaRegistry; from coworker.personas.task_package import media_task_package,company_task_package; from coworker.personas.product_contract import PersonaSession,canonical_handoffs; from coworker.personas.submission import PersonaJobSubmission,SubmissionContractError; r=PersonaRegistry(); assert r.get('media') is not None; assert r.get('company') is not None; m=media_task_package(title='m',brief='b'); assert PersonaSession(persona='media',session_id='s1',workspace_id='w1').persona.value=='media'; assert canonical_handoffs(m)[0].authority=='AI-Engineering-OS'; assert company_task_package(title='c',brief='b').kind.value=='company'; assert PersonaJobSubmission(project_id='p',job_id='j',reused=False,task_package_path='t',persona='media',session_id='s',handoff_capabilities=('media',)).to_dict()['authority']=='AI-Engineering-OS'; assert issubclass(SubmissionContractError, ValueError); print('E7 personas/submission contracts loaded')"
