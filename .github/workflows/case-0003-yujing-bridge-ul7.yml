name: Case 0003 Yujing Bridge UL7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case-0003-yujing-bridge-ul7.yml'

concurrency:
  group: case-0003-yujing-bridge-ul7
  cancel-in-progress: false

env:
  CASE0003_ASSIGNED_HOST: DESKTOP-UL7V2VV
  CASE0003_LOCATION_TEXT: 臺南市玉井橋
  CASE0003_DELIVERY_CASE: '0003'

jobs:
  ul7-route:
    name: UL7 route (${{ matrix.slot }})
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Route candidate to UL7 only
        id: route
        shell: powershell
        run: |
          $hostName = $env:COMPUTERNAME
          $assigned = $env:CASE0003_ASSIGNED_HOST
          Write-Host "CASE0003_ROUTE slot=${{ matrix.slot }} host=$hostName assigned=$assigned runner=$env:RUNNER_NAME"
          if ($hostName -ieq $assigned) {
            "selected=true" >> $env:GITHUB_OUTPUT
            Write-Host "CASE0003_UL7_SELECTED slot=${{ matrix.slot }} host=$hostName runner=$env:RUNNER_NAME"
          } else {
            "selected=false" >> $env:GITHUB_OUTPUT
            Write-Host "CASE0003_SKIP_WRONG_HOST slot=${{ matrix.slot }} host=$hostName assigned=$assigned"
          }

      - name: Report UL7 runner identity
        if: steps.route.outputs.selected == 'true'
        shell: cmd
        run: |
          @echo off
          echo CASE0003_UL7_RUNNER_OK
          echo COMPUTERNAME=%COMPUTERNAME%
          echo RUNNER_NAME=%RUNNER_NAME%
          echo RUNNER_OS=%RUNNER_OS%
          echo RUNNER_ARCH=%RUNNER_ARCH%
          echo GITHUB_RUN_ID=%GITHUB_RUN_ID%
          echo GITHUB_JOB=%GITHUB_JOB%

      - name: Verify existing tool readiness
        if: steps.route.outputs.selected == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== CASE 0003 existing-tool readiness ==='
          foreach ($name in @('go-tool','blender')) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host "$name=$($cmd.Source)"
            } else {
              Write-Host "$name=NOT_FOUND"
            }
          }
          Write-Host 'CASE0003_READINESS_PROBE_DONE'

      - name: Record canonical case input
        if: steps.route.outputs.selected == 'true'
        shell: powershell
        run: |
          Write-Host 'CASE0003_MANUAL_EVOLVING_GAP_FIX_CLOSURE'
          Write-Host "LOCATION_TEXT=$env:CASE0003_LOCATION_TEXT"
          Write-Host "DELIVERY_CASE=$env:CASE0003_DELIVERY_CASE"
          Write-Host "ASSIGNED_HOST=$env:CASE0003_ASSIGNED_HOST"
