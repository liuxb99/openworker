name: Probe O87 Google Drive Desktop

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.event.pull_request.title == '[openworker-control] probe_o87_drive_desktop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, O87]
    timeout-minutes: 5
    steps:
      - name: Verify O87 and inspect Drive Desktop layout
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine 'DESKTOP-O87PJNR'){throw "wrong host=$env:COMPUTERNAME"}
          Get-PSDrive -PSProvider FileSystem|Format-Table Name,Root,Description -AutoSize|Out-String|Write-Host
          try{Get-Volume|Select-Object DriveLetter,FileSystemLabel,FileSystem,DriveType,HealthStatus|Format-Table -AutoSize|Out-String|Write-Host}catch{Write-Host "GET_VOLUME_SKIP $($_.Exception.Message)"}
          foreach($root in @('G:\','D:\','C:\')){
            if(-not(Test-Path -LiteralPath $root -PathType Container)){continue}
            Write-Host "ROOT_BEGIN $root"
            try{Get-ChildItem -LiteralPath $root -Force -ErrorAction Stop|Select-Object -First 50 Name,FullName,PSIsContainer|Format-Table -AutoSize|Out-String|Write-Host}catch{Write-Host "ROOT_LIST_FAIL root=$root reason=$($_.Exception.Message)"}
            Write-Host "ROOT_END $root"
          }
          $found=@()
          foreach($d in Get-PSDrive -PSProvider FileSystem){
            foreach($name in @('My Drive','我的雲端硬碟','Google Drive')){
              $c=Join-Path $d.Root $name
              try{if(Test-Path -LiteralPath $c -PathType Container -ErrorAction Stop){$found += (Resolve-Path -LiteralPath $c).Path}}catch{}
            }
          }
          if($found.Count -gt 0){Write-Host ('OPENWORKER_O87_DRIVE_DESKTOP_PASS roots='+($found -join ';')); exit 0}
          Write-Host 'OPENWORKER_O87_DRIVE_LAYOUT_PROBED no-standard-subdir'
