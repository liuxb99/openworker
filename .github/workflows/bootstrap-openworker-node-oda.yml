name: Bootstrap OpenWorker Node Service ODA

on:
  workflow_dispatch:
    inputs:
      listen:
        description: Local bind address
        required: false
        default: '127.0.0.1:8787'
        type: string
      advertise:
        description: Reachable URL other nodes should use
        required: false
        type: string
      peers:
        description: Comma-separated reachable OpenWorker node URLs
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bootstrap-oda-node]')
    runs-on: [self-hosted, Windows, X64, ODA]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed ODA computer
        shell: powershell
        run: if($env:COMPUTERNAME -ine 'DESKTOP-ODAQN0D'){throw "wrong host $env:COMPUTERNAME"}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go-runtime/go.sum
      - name: Build native Windows service binary
        shell: powershell
        working-directory: go-runtime
        run: |
          go mod tidy
          $commit=$env:GITHUB_SHA
          $build=[DateTime]::UtcNow.ToString('o')
          go build -ldflags "-X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.Version=p2-node -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.Commit=$commit -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.TargetCommit=$commit -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.BuildTime=$build" -o openworker-node.exe ./cmd/openworker-node
      - name: Install or upgrade OpenWorkerNode service
        shell: powershell
        env:
          LISTEN: ${{ inputs.listen || '127.0.0.1:8787' }}
          ADVERTISE: ${{ inputs.advertise }}
          PEERS: ${{ inputs.peers }}
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\install_openworker_node_service.ps1" -SourceExe "$env:GITHUB_WORKSPACE\go-runtime\openworker-node.exe" -Workers 4 -Capabilities 'case0002,case0005,comfyx,minimax-h3,video,storyboard,presentation,local-supervisor' -Listen $env:LISTEN -Advertise $env:ADVERTISE -Peers $env:PEERS
      - name: Verify service node identity inventory lease and upgrade receipt
        shell: powershell
        run: |
          $s=Invoke-RestMethod 'http://127.0.0.1:8787/v1/node/status'
          if($s.machine -ine 'DESKTOP-ODAQN0D'){throw "node machine=$($s.machine)"}
          if($s.build.commit -ne $env:GITHUB_SHA){throw "node commit=$($s.build.commit) expected=$env:GITHUB_SHA"}
          if($s.service.running_commit -ne $env:GITHUB_SHA){throw "running_commit=$($s.service.running_commit) expected=$env:GITHUB_SHA"}
          if($s.service.target_commit -ne $env:GITHUB_SHA){throw "target_commit=$($s.service.target_commit) expected=$env:GITHUB_SHA"}
          if($s.service.upgrade_status -ne 'VERIFIED' -or -not $s.service.upgrade_verified){throw "upgrade not verified: $($s.service | ConvertTo-Json -Compress)"}
          if(-not $s.service.service_started_at){throw 'missing service_started_at'}
          if($s.service.supervisor_api_version -ne 'v1'){throw "unexpected supervisor_api_version=$($s.service.supervisor_api_version)"}
          if(-not $s.lease_until){throw 'missing lease_until'}
          foreach($cap in @('comfyx','case0005','local-supervisor')){if(-not ($s.inventory.capabilities -contains $cap)){throw "missing $cap capability"}}
          if(-not $s.advertise_endpoint){throw 'missing advertise endpoint'}
          $s|ConvertTo-Json -Depth 20
      - name: Bootstrap Case 0005 through upgraded local supervisor
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[case0005-local-bootstrap]')
        shell: powershell
        run: |
          function Resolve-RepoRoot([string[]]$Names,[string[]]$Markers){
            $bases=@('D:\actions-runner\_work','D:\AI','D:\AIWork','D:\PyWork') | Where-Object { Test-Path -LiteralPath $_ }
            foreach($name in $Names){
              $fast=@(
                (Join-Path 'D:\actions-runner\_work' "$name\$name"),
                (Join-Path 'D:\AI' $name),
                (Join-Path 'D:\AIWork' $name),
                (Join-Path 'D:\PyWork' $name)
              )
              foreach($c in $fast){
                if(-not (Test-Path -LiteralPath $c -PathType Container)){continue}
                $ok=$true; foreach($m in $Markers){if(-not (Test-Path -LiteralPath (Join-Path $c $m))){$ok=$false;break}}
                if($ok){return (Resolve-Path $c).Path}
              }
            }
            foreach($base in $bases){
              foreach($name in $Names){
                $dirs=Get-ChildItem -LiteralPath $base -Directory -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.Name -ieq $name} | Select-Object -First 12
                foreach($d in $dirs){
                  $ok=$true; foreach($m in $Markers){if(-not (Test-Path -LiteralPath (Join-Path $d.FullName $m))){$ok=$false;break}}
                  if($ok){return $d.FullName}
                }
              }
            }
            throw "local checkout not found names=$($Names -join ',') markers=$($Markers -join ',')"
          }

          $workspace='D:\AI-Work\jobs\0005-SNOW-WHITE'
          $goTool=Resolve-RepoRoot @('go-tool-runtime') @('go.mod','cmd\gtr-local-exec\main.go')
          $comfyx=Resolve-RepoRoot @('ComfyX') @('go.mod','cmd\comfyx-synthesis-video-real')
          $studio=Resolve-RepoRoot @('Comfyx-Studio') @('go.mod','cmd\operator-director-preproduction')
          $openmaic=Resolve-RepoRoot @('OpenMAIC','openmaic-fork') @('package.json','src\cli\presentation.ts')
          $outputCandidates=@('D:\Comfy-Desktop\ComfyUI-Installs\ComfyUI\ComfyUI\output','D:\ComfyUI\output')
          $comfyOutput=$outputCandidates | Where-Object {Test-Path -LiteralPath $_ -PathType Container} | Select-Object -First 1
          if(-not $comfyOutput){throw 'COMFYX_COMFYUI_OUTPUT_ROOT authority not found on ODA'}

          $body=@{
            case_id='0005'
            machine='DESKTOP-ODAQN0D'
            workspace_root=$workspace
            openworker_root=$env:GITHUB_WORKSPACE
            controller_module='coworker.case0005_controller'
            manifest_path='case-worklists\0005.json'
            spec_path='case-specs\0005.json'
            python_exe='python'
            env=@{
              GO_TOOL_ROOT=$goTool
              COMFYX_ROOT=$comfyx
              COMFYX_STUDIO_ROOT=$studio
              OPENMAIC_ROOT=$openmaic
              COMFYX_COMFYUI_OUTPUT_ROOT=$comfyOutput
            }
          } | ConvertTo-Json -Depth 10
          $ack=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8787/v1/cases/bootstrap' -ContentType 'application/json' -Body $body
          if(-not $ack.workspace_created){throw 'local case bootstrap did not materialize workspace'}
          if(-not $ack.job.accepted){throw 'local case bootstrap durable ACK not accepted'}
          if(-not (Test-Path -LiteralPath $workspace -PathType Container)){throw 'Case 0005 workspace still missing after durable ACK'}
          $receiptDir=Join-Path $workspace 'evidence'; New-Item -ItemType Directory -Force -Path $receiptDir | Out-Null
          $status=Invoke-RestMethod 'http://127.0.0.1:8787/v1/node/status'
          if(-not $status.service.upgrade_verified){throw 'refusing case bootstrap receipt without verified service upgrade'}
          $receipt=@{schema='openworker/oda-upgrade-case0005-bootstrap/v2'; service_commit=$status.service.running_commit; target_commit=$status.service.target_commit; upgrade_status=$status.service.upgrade_status; upgrade_verified=$status.service.upgrade_verified; service_started_at=$status.service.service_started_at; supervisor_api_version=$status.service.supervisor_api_version; machine=$env:COMPUTERNAME; verified_at=[DateTimeOffset]::UtcNow.ToString('o'); ack=$ack}
          $receipt | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath (Join-Path $receiptDir 'oda-upgrade-case0005-bootstrap.json') -Encoding utf8
          $ack | ConvertTo-Json -Depth 20
