name: Bootstrap OpenWorker Node Service ODA

on:
  workflow_dispatch:
    inputs:
      listen:
        description: Local bind address
        required: false
        default: '127.0.0.1:8787'
        type: string
      advertise:
        description: Reachable URL other nodes should use
        required: false
        type: string
      peers:
        description: Comma-separated reachable OpenWorker node URLs
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bootstrap-oda-node]') || contains(github.event.head_commit.message, '[upgrade-openworker-nodes]')
    runs-on: [self-hosted, Windows, X64, ODA]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify fixed ODA computer
        shell: powershell
        run: if($env:COMPUTERNAME -ine 'DESKTOP-ODAQN0D'){throw "wrong host $env:COMPUTERNAME"}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go-runtime/go.sum
      - name: Build native Windows service binary
        shell: powershell
        working-directory: go-runtime
        run: |
          go mod tidy
          $commit=$env:GITHUB_SHA
          $build=[DateTime]::UtcNow.ToString('o')
          go build -ldflags "-X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.Version=p2-node -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.Commit=$commit -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.TargetCommit=$commit -X github.com/liuxb99/openworker/go-runtime/internal/buildinfo.BuildTime=$build" -o openworker-node.exe ./cmd/openworker-node
      - name: Install or upgrade OpenWorkerNode service
        shell: powershell
        env:
          LISTEN: ${{ inputs.listen || '127.0.0.1:8787' }}
          ADVERTISE: ${{ inputs.advertise }}
          PEERS: ${{ inputs.peers }}
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\install_openworker_node_service.ps1" -SourceExe "$env:GITHUB_WORKSPACE\go-runtime\openworker-node.exe" -Workers 4 -Capabilities 'case0002,case0005,comfyx,minimax-h3,video,storyboard,presentation,local-supervisor' -Listen $env:LISTEN -Advertise $env:ADVERTISE -Peers $env:PEERS
      - name: Verify installed service and Go Case continue route
        id: verify
        shell: powershell
        run: |
          $svc=Get-Service OpenWorkerNode
          if($svc.Status -ne 'Running'){throw "service status=$($svc.Status)"}
          $s=Invoke-RestMethod 'http://127.0.0.1:8787/v1/node/status'
          if($s.machine -ine 'DESKTOP-ODAQN0D'){throw "node machine=$($s.machine)"}
          if($s.build.commit -ne $env:GITHUB_SHA){throw "node commit=$($s.build.commit) expected=$env:GITHUB_SHA"}
          if($s.service.running_commit -ne $env:GITHUB_SHA){throw "running_commit=$($s.service.running_commit) expected=$env:GITHUB_SHA"}
          if($s.service.target_commit -ne $env:GITHUB_SHA){throw "target_commit=$($s.service.target_commit) expected=$env:GITHUB_SHA"}
          if($s.service.upgrade_status -ne 'VERIFIED' -or -not $s.service.upgrade_verified){throw "upgrade not verified: $($s.service | ConvertTo-Json -Compress)"}
          if(-not $s.service.service_started_at){throw 'missing service_started_at'}
          if($s.service.supervisor_api_version -ne 'v1'){throw "unexpected supervisor_api_version=$($s.service.supervisor_api_version)"}
          if(-not $s.lease_until){throw 'missing lease_until'}
          foreach($cap in @('comfyx','case0005','local-supervisor')){if(-not ($s.inventory.capabilities -contains $cap)){throw "missing $cap capability"}}
          if(-not $s.advertise_endpoint){throw 'missing advertise endpoint'}

          $routeStatus=0
          try {
            Invoke-WebRequest -UseBasicParsing -Method Post -Uri 'http://127.0.0.1:8787/v1/cases/continue' -ContentType 'application/json' -Body '{}' -TimeoutSec 5 | Out-Null
            $routeStatus=200
          } catch {
            if($null -ne $_.Exception.Response){$routeStatus=[int]$_.Exception.Response.StatusCode}else{throw}
          }
          if($routeStatus -eq 404 -or $routeStatus -eq 0){throw "Go Case continue route unavailable status=$routeStatus"}
          "route_status=$routeStatus" >> $env:GITHUB_OUTPUT
          $s|ConvertTo-Json -Depth 20
      - name: Publish immutable resident node deployment receipt
        shell: powershell
        env:
          ROUTE_STATUS: ${{ steps.verify.outputs.route_status }}
        run: |
          $ErrorActionPreference='Stop'
          $status=Invoke-RestMethod 'http://127.0.0.1:8787/v1/node/status'
          $receipt=[ordered]@{
            schema='openworker.oda-resident-node-deployment/v1'
            machine=$env:COMPUTERNAME
            github_run_id=$env:GITHUB_RUN_ID
            github_run_attempt=$env:GITHUB_RUN_ATTEMPT
            requested_commit=$env:GITHUB_SHA
            running_commit=$status.service.running_commit
            target_commit=$status.service.target_commit
            upgrade_status=$status.service.upgrade_status
            upgrade_verified=[bool]$status.service.upgrade_verified
            service_started_at=$status.service.service_started_at
            supervisor_api_version=$status.service.supervisor_api_version
            case_continue_route_status=[int]$env:ROUTE_STATUS
            case_continue_route_present=([int]$env:ROUTE_STATUS -ne 404 -and [int]$env:ROUTE_STATUS -gt 0)
            python_controller_allowed=$false
            github_action_used_for_business_execution=$false
            verified_at=[DateTimeOffset]::UtcNow.ToString('o')
          }
          git config user.name 'openworker-node-deploy'
          git config user.email 'openworker-node-deploy@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          $rel="evidence/deployments/openworker-node-ODA/$env:GITHUB_RUN_ID.json"
          $path=Join-Path $env:GITHUB_WORKSPACE ($rel -replace '/','\')
          New-Item -ItemType Directory -Force -Path (Split-Path $path)|Out-Null
          [IO.File]::WriteAllText($path,($receipt|ConvertTo-Json -Depth 12)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          git add -- $rel
          git commit -m "receipt: ODA resident Go node $env:GITHUB_RUN_ID"
          if($LASTEXITCODE -ne 0){throw 'failed to commit node receipt'}
          $pushed=$false
          for($i=0;$i -lt 4;$i++){
            git pull --rebase origin main
            if($LASTEXITCODE -ne 0){git rebase --abort 2>$null;Start-Sleep -Seconds 1;continue}
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){$pushed=$true;break}
            Start-Sleep -Seconds 2
          }
          if(-not $pushed){throw 'failed to push node receipt'}
      - name: Bootstrap Case 0005 through Go-native Case Engine
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[case0005-local-bootstrap]')
        shell: powershell
        run: |
          $workspace='D:\AI-Work\jobs\0005-SNOW-WHITE'
          $body=@{
            case_id='0005'
            machine='DESKTOP-ODAQN0D'
            workspace_root=$workspace
            openworker_root=$env:GITHUB_WORKSPACE
            manifest_path='case-worklists\0005.json'
            spec_path='case-specs\0005.json'
            env=@{
              GTR_WORK_QUEUE_URL='http://127.0.0.1:8848'
              GTR_LOCAL_WORKERS='4'
              OPENWORKER_ROOT=$env:GITHUB_WORKSPACE
            }
          } | ConvertTo-Json -Depth 10
          $ack=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8787/v1/cases/bootstrap' -ContentType 'application/json' -Body $body
          if(-not $ack.ok){throw "Go-native Case bootstrap failed: $($ack | ConvertTo-Json -Compress -Depth 20)"}
          if($ack.controller -ne 'go-native'){throw "unexpected controller=$($ack.controller)"}
          if($ack.python_required){throw 'Go-native bootstrap unexpectedly requires Python'}
          if($ack.stage -ne 'go_native_bootstrap_completed'){throw "unexpected stage=$($ack.stage)"}
          if(-not (Test-Path -LiteralPath $workspace -PathType Container)){throw 'Case 0005 workspace missing after Go-native bootstrap'}
          $receiptDir=Join-Path $workspace 'evidence'; New-Item -ItemType Directory -Force -Path $receiptDir | Out-Null
          $status=Invoke-RestMethod 'http://127.0.0.1:8787/v1/node/status'
          if(-not $status.service.upgrade_verified){throw 'refusing case bootstrap receipt without verified service upgrade'}
          $receipt=@{schema='openworker/oda-upgrade-case0005-go-bootstrap/v3'; service_commit=$status.service.running_commit; target_commit=$status.service.target_commit; upgrade_status=$status.service.upgrade_status; upgrade_verified=$status.service.upgrade_verified; service_started_at=$status.service.service_started_at; supervisor_api_version=$status.service.supervisor_api_version; machine=$env:COMPUTERNAME; controller='go-native'; python_required=$false; verified_at=[DateTimeOffset]::UtcNow.ToString('o'); ack=$ack}
          $receipt | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath (Join-Path $receiptDir 'oda-upgrade-case0005-go-bootstrap.json') -Encoding utf8
          $ack | ConvertTo-Json -Depth 20
